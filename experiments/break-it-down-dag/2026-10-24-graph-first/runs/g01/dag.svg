<svg xmlns="http://www.w3.org/2000/svg" width="1166" height="2280" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M159,165 L159,185 L958,185 L958,584 L469,584 L469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>python → run: An evaluation loop is composed of familiar records, API calls and stored outputs.</title></a><a href="#edge-2"><path d="M469,165 C469,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>system → intent: Acceptable behavior must be defined for the application being evaluated.</title></a><a href="#edge-3"><path d="M159,355 C159,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>intent → reference: Case expectations must express the task’s intended behavior.</title></a><a href="#edge-4"><path d="M159,355 C159,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>intent → cases: The task determines which situations a dataset must cover.</title></a><a href="#edge-5"><path d="M469,545 C469,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>cases → run: The run needs saved inputs to exercise the application.</title></a><a href="#edge-6"><path d="M469,165 L469,185 L970,185 L970,584 L469,584 L469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>system → run: The configuration identifies which application produced the outputs.</title></a><a href="#edge-7"><path d="M159,545 L159,565 L982,565 L982,774 L159,774 L159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>reference → grade: Judgments need the relevant expectations for each case.</title></a><a href="#edge-8"><path d="M469,735 C469,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>run → grade: A grader requires the actual output from the application.</title></a><a href="#edge-9"><path d="M159,925 C159,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>grade → calibrate: To judge whether automation measures quality, first understand its rule.</title></a><a href="#edge-10"><path d="M469,165 L469,185 L994,185 L994,394 L779,394 L779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>system → outcome: The system boundary determines whether actions and turns are part of behavior.</title></a><a href="#edge-11"><path d="M159,355 C159,382 779,383 779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>intent → outcome: Expected outcomes determine what action or conversation evidence is needed.</title></a><a href="#edge-12"><path d="M159,925 L159,945 L1006,945 L1006,1154 L159,1154 L159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>grade → summary: A numerical summary inherits the meaning of its individual judgments.</title></a><a href="#edge-13"><path d="M469,545 L469,565 L1018,565 L1018,1154 L159,1154 L159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>cases → summary: The sampled situations limit what the summary represents.</title></a><a href="#edge-14"><path d="M159,1115 C159,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>calibrate → summary: A score is meaningful only to the extent that grading tracks intent.</title></a><a href="#edge-15"><path d="M159,1305 L159,1325 L1030,1325 L1030,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>summary → compare: Comparing numbers requires knowing what they measure.</title></a><a href="#edge-16"><path d="M159,1685 C159,1712 159,1713 159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>compare → improve: Evidence of gain and regression is needed to assess a proposed improvement.</title></a><a href="#edge-17"><path d="M159,1875 C159,1902 159,1903 159,1930" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>improve → start: A starter workflow should close the loop from failures to evaluated changes.</title></a><a href="#edge-18"><path d="M159,2065 C159,2092 159,2093 159,2120" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>start → target: The target explicitly asks how to begin.</title></a><a href="#edge-19"><path d="M779,165 L779,185 L1042,185 L1042,2104 L159,2104 L159,2120" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>variation → target: Variation explains why informal spot checking is insufficient.</title></a><a href="#edge-20"><path d="M159,1305 L159,1325 L1054,1325 L1054,2104 L159,2104 L159,2120" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>summary → target: Knowing what scores establish explains the value and limits of evals.</title></a><a href="#edge-21"><path d="M779,545 C779,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>outcome → run: Knowing the observable behavior determines which outputs and effects a run must record.</title></a><a href="#edge-22"><path d="M779,165 L779,185 L1066,185 L1066,774 L469,774 L469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>variation → repeat: Repeated attempts matter because identical inputs can yield different outputs.</title></a><a href="#edge-23"><path d="M469,735 C469,762 469,763 469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>run → repeat: A trial repeats the defined execution of a case.</title></a><a href="#edge-24"><path d="M469,925 L469,945 L1078,945 L1078,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>repeat → compare: Score differences must be interpreted alongside within-case variability.</title></a><a href="#edge-25"><path d="M469,545 C469,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>cases → holdout: Withholding cases requires understanding the test collection and its coverage.</title></a><a href="#edge-26"><path d="M159,735 L159,755 L1090,755 L1090,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>holdout → compare: Unused examples check whether gains extend beyond the examples used to tune.</title></a><a href="#edge-27"><path d="M159,1305 C159,1332 159,1333 159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>summary → slices: Subgroup rates partition the same numerator and denominator used by the overall rate.</title></a><a href="#edge-28"><path d="M159,1495 C159,1522 159,1523 159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>slices → compare: An overall gain can conceal worsening behavior in a required support scenario.</title></a><a href="#edge-29"><path d="M159,1115 L159,1135 L1102,1135 L1102,1914 L159,1914 L159,1930" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>calibrate → start: Automating the starter workflow requires checking that judgments match expert expectations.</title></a><a href="#node-python"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">python · assumed</text><text x="36" y="77" font-size="15" fill="#101527">What can the reader already do?</text></a><a href="#node-system"><rect x="334" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="51" fill="#46734d" font-size="12">system · supported</text><text x="346" y="77" font-size="15" fill="#101527">What exactly are we evaluating?</text></a><a href="#node-variation"><rect x="644" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="51" fill="#46734d" font-size="12">variation · supported</text><text x="656" y="77" font-size="15" fill="#101527">Why does one successful answer</text><text x="656" y="97" font-size="15" fill="#101527">not establish reliability?</text></a><a href="#node-intent"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">intent · supported</text><text x="36" y="267" font-size="15" fill="#101527">What would acceptable support</text><text x="36" y="287" font-size="15" fill="#101527">behavior mean?</text></a><a href="#node-cases"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">cases · supported</text><text x="346" y="457" font-size="15" fill="#101527">What inputs should the test</text><text x="346" y="477" font-size="15" fill="#101527">contain?</text></a><a href="#node-reference"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">reference · supported</text><text x="36" y="457" font-size="15" fill="#101527">How do we know what should have</text><text x="36" y="477" font-size="15" fill="#101527">happened in each case?</text></a><a href="#node-run"><rect x="334" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="621" fill="#46734d" font-size="12">run · supported</text><text x="346" y="647" font-size="15" fill="#101527">What happens during one</text><text x="346" y="667" font-size="15" fill="#101527">evaluation run?</text></a><a href="#node-grade"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">grade · supported</text><text x="36" y="837" font-size="15" fill="#101527">How does an output become a</text><text x="36" y="857" font-size="15" fill="#101527">result?</text></a><a href="#node-calibrate"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">calibrate · supported</text><text x="36" y="1027" font-size="15" fill="#101527">Why must automated grades</text><text x="36" y="1047" font-size="15" fill="#101527">themselves be checked?</text></a><a href="#node-outcome"><rect x="644" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="431" fill="#46734d" font-size="12">outcome · supported</text><text x="656" y="457" font-size="15" fill="#101527">How do we evaluate actions and</text><text x="656" y="477" font-size="15" fill="#101527">conversations, not just one</text><text x="656" y="497" font-size="15" fill="#101527">answer?</text></a><a href="#node-summary"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">summary · supported</text><text x="36" y="1217" font-size="15" fill="#101527">What does a score mean?</text></a><a href="#node-compare"><rect x="24" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1571" fill="#46734d" font-size="12">compare · supported</text><text x="36" y="1597" font-size="15" fill="#101527">How do we compare changes</text><text x="36" y="1617" font-size="15" fill="#101527">without overinterpreting</text><text x="36" y="1637" font-size="15" fill="#101527">scores?</text></a><a href="#node-improve"><rect x="24" y="1740" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1761" fill="#46734d" font-size="12">improve · supported</text><text x="36" y="1787" font-size="15" fill="#101527">How does testing guide</text><text x="36" y="1807" font-size="15" fill="#101527">improvements?</text></a><a href="#node-start"><rect x="24" y="1930" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1951" fill="#46734d" font-size="12">start · supported</text><text x="36" y="1977" font-size="15" fill="#101527">What is a small first support-</text><text x="36" y="1997" font-size="15" fill="#101527">assistant eval?</text></a><a href="#node-target"><rect x="24" y="2120" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="2141" fill="#46734d" font-size="12">target · supported</text><text x="36" y="2167" font-size="15" fill="#101527">Why do I need AI application</text><text x="36" y="2187" font-size="15" fill="#101527">evals, how do they work, and</text><text x="36" y="2207" font-size="15" fill="#101527">how do I start evaluating a</text><text x="36" y="2227" font-size="15" fill="#101527">customer-support assistant?</text></a><a href="#node-repeat"><rect x="334" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="811" fill="#46734d" font-size="12">repeat · supported</text><text x="346" y="837" font-size="15" fill="#101527">Why run the same case more than</text><text x="346" y="857" font-size="15" fill="#101527">once?</text></a><a href="#node-holdout"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">holdout · supported</text><text x="36" y="647" font-size="15" fill="#101527">Why keep some cases out of day-</text><text x="36" y="667" font-size="15" fill="#101527">to-day tuning?</text></a><a href="#node-slices"><rect x="24" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1381" fill="#46734d" font-size="12">slices · supported</text><text x="36" y="1407" font-size="15" fill="#101527">Why inspect groups of cases</text><text x="36" y="1427" font-size="15" fill="#101527">instead of only the overall</text><text x="36" y="1447" font-size="15" fill="#101527">score?</text></a></svg>