<svg xmlns="http://www.w3.org/2000/svg" width="2418" height="1140" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M469,165 C469,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → atomicity: The all-or-nothing unit is the transaction and its grouped writes.</title></a><a href="#edge-2"><path d="M469,165 C469,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → concurrency: Overlap refers to whole transactions that have begun and not yet ended.</title></a><a href="#edge-3"><path d="M469,355 C469,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>concurrency → read_decision: A decision can become outdated because another unfinished transaction can act between the read and update.</title></a><a href="#edge-4"><path d="M469,165 C469,192 779,193 779,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → serial: Serial order orders complete transactions rather than individual SQL statements.</title></a><a href="#edge-5"><path d="M779,355 C779,382 1399,383 1399,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serial → serializable: The guarantee is defined by comparison to an allowed serial execution.</title></a><a href="#edge-6"><path d="M159,165 L159,185 L2198,185 L2198,584 L159,584 L159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>rule → wrong_result: Wrong means breaking the explicitly supplied at-least-one-on-call rule.</title></a><a href="#edge-7"><path d="M159,545 C159,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>read_decision → wrong_result: Both updates are based on earlier observations that the other staff member remains on call.</title></a><a href="#edge-8"><path d="M469,165 C469,192 1089,193 1089,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → dirty: Uncommitted means the other transaction has not successfully ended with COMMIT.</title></a><a href="#edge-9"><path d="M469,355 C469,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>concurrency → nonrepeatable: The value can change because another transaction commits between reads.</title></a><a href="#edge-10"><path d="M469,355 C469,382 779,383 779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>concurrency → phantom: Matching membership can change because another transaction commits between queries.</title></a><a href="#edge-11"><path d="M469,165 C469,192 1399,193 1399,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → snapshot: Visibility includes the transaction’s own changes and excludes changes based on transaction completion.</title></a><a href="#edge-12"><path d="M1399,355 C1399,382 1709,383 1709,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → read_committed: Statement-start reference points determine what each read can see.</title></a><a href="#edge-13"><path d="M1399,355 C1399,382 2019,383 2019,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → repeatable_read: A fixed transaction reference point explains why later reads retain earlier row versions.</title></a><a href="#edge-14"><path d="M1089,355 L1089,375 L2210,375 L2210,584 L1089,584 L1089,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>dirty → levels: The first minimum protection boundary forbids reading uncommitted work.</title></a><a href="#edge-15"><path d="M469,545 C469,572 1089,573 1089,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>nonrepeatable → levels: The next minimum protection forbids changed values in repeated reads.</title></a><a href="#edge-16"><path d="M779,545 C779,572 1089,573 1089,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>phantom → levels: Phantom protection differs across minimum rules and engine implementations.</title></a><a href="#edge-17"><path d="M1399,545 C1399,572 1089,573 1089,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serializable → levels: The strongest listed guarantee requires a serial-equivalent committed result.</title></a><a href="#edge-18"><path d="M469,355 C469,382 1089,383 1089,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>concurrency → locks: Incompatible access arises when overlapping transactions request conflicting use of protected data.</title></a><a href="#edge-19"><path d="M1399,355 L1399,375 L2222,375 L2222,584 L1709,584 L1709,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → mechanisms: Snapshots demonstrate how version selection implements read visibility.</title></a><a href="#edge-20"><path d="M1089,545 C1089,572 1709,573 1709,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>locks → mechanisms: Locks demonstrate how waiting implements access coordination.</title></a><a href="#edge-21"><path d="M1399,545 C1399,572 1709,573 1709,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serializable → mechanisms: Serializable is an outcome constraint whose implementations can differ.</title></a><a href="#edge-22"><path d="M1399,355 L1399,375 L2234,375 L2234,584 L2019,584 L2019,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → statement_kind: Plain reads can return data selected by a past visibility point.</title></a><a href="#edge-23"><path d="M1089,545 C1089,572 2019,573 2019,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>locks → statement_kind: Locking statements coordinate access beyond merely selecting a visible version.</title></a><a href="#edge-24"><path d="M1089,735 C1089,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>levels → engine: Names have minimum protections rather than one universal implementation.</title></a><a href="#edge-25"><path d="M2019,735 C2019,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>statement_kind → engine: An engine’s guarantees must be qualified by the operation being executed.</title></a><a href="#edge-26"><path d="M469,165 L469,185 L2246,185 L2246,584 L469,584 L469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → retry: Retrying whole work requires restoring the complete transaction, including reads and decisions.</title></a><a href="#edge-27"><path d="M1399,545 C1399,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serializable → retry: Rejecting an attempt can be necessary to preserve a serial-equivalent committed outcome.</title></a><a href="#edge-28"><path d="M159,355 L159,375 L2258,375 L2258,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>atomicity → target: Grouping changes atomically does not alone settle which concurrent observations are allowed.</title></a><a href="#edge-29"><path d="M159,735 L159,755 L2270,755 L2270,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>wrong_result → target: The question asks how two individually correct operations can collectively break an application rule.</title></a><a href="#edge-30"><path d="M1089,735 L1089,755 L2282,755 L2282,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>levels → target: The answer must explain how named guarantee strengths constrain anomalies.</title></a><a href="#edge-31"><path d="M1709,735 L1709,755 L2294,755 L2294,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>mechanisms → target: The answer must distinguish outcome promises from how the database enforces them.</title></a><a href="#edge-32"><path d="M159,925 C159,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>engine → target: Practical interpretation requires engine and statement qualifications.</title></a><a href="#edge-33"><path d="M469,735 L469,755 L2306,755 L2306,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>retry → target: Preventing an unsafe commit can require application retry behavior rather than automatic success.</title></a><a href="#edge-34"><path d="M2019,545 C2019,572 1399,573 1399,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>repeatable_read → stable_not_serial: The distinction concerns the stable per-transaction view this level supplies.</title></a><a href="#edge-35"><path d="M1399,545 C1399,572 1399,573 1399,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serializable → stable_not_serial: A serialization anomaly means failure of the serial-order outcome criterion.</title></a><a href="#edge-36"><path d="M159,545 C159,572 1399,573 1399,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>read_decision → stable_not_serial: Read-dependent writes can encode incompatible decisions despite each fixed view.</title></a><a href="#edge-37"><path d="M1399,735 L1399,755 L2318,755 L2318,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>stable_not_serial → target: The answer must explain why stable reads do not yet provide the strongest outcome guarantee.</title></a><a href="#edge-38"><path d="M1399,545 C1399,572 779,573 779,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serializable → correctness_limit: Preservation is proved using an equivalent serial ordering of committed transactions.</title></a><a href="#edge-39"><path d="M159,165 L159,185 L2330,185 L2330,584 L779,584 L779,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>rule → correctness_limit: The invariant to preserve must be supplied independently of isolation.</title></a><a href="#edge-40"><path d="M469,165 L469,185 L2342,185 L2342,584 L779,584 L779,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → correctness_limit: The full decision and its writes must be inside the unit ordered by serializability.</title></a><a href="#edge-41"><path d="M779,735 L779,755 L2354,755 L2354,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>correctness_limit → target: The stated protection depends on valid transaction boundaries and correct serial logic.</title></a><a href="#edge-42"><path d="M159,545 C159,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>read_decision → retry: Whole-transaction retries must recompute the decisions that chose the writes.</title></a><a href="#edge-43"><path d="M1709,545 C1709,572 2019,573 2019,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>read_committed → statement_kind: The comparison starts from PostgreSQL Read Committed’s plain-SELECT snapshot rule before showing how UPDATE can use a newer row.</title></a><a href="#node-rule"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">rule · assumed</text><text x="36" y="77" font-size="15" fill="#101527">What makes a result correct?</text></a><a href="#node-transaction"><rect x="334" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="51" fill="#46734d" font-size="12">transaction · supported</text><text x="346" y="77" font-size="15" fill="#101527">What is a transaction?</text></a><a href="#node-atomicity"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">atomicity · supported</text><text x="36" y="267" font-size="15" fill="#101527">What does all-or-nothing</text><text x="36" y="287" font-size="15" fill="#101527">execution guarantee?</text></a><a href="#node-concurrency"><rect x="334" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="241" fill="#46734d" font-size="12">concurrency · supported</text><text x="346" y="267" font-size="15" fill="#101527">How can transactions overlap?</text></a><a href="#node-read_decision"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">read_decision · supported</text><text x="36" y="457" font-size="15" fill="#101527">How does a read affect a later</text><text x="36" y="477" font-size="15" fill="#101527">update?</text></a><a href="#node-serial"><rect x="644" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="241" fill="#46734d" font-size="12">serial · supported</text><text x="656" y="267" font-size="15" fill="#101527">What is a serial execution?</text></a><a href="#node-serializable"><rect x="1264" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1276" y="431" fill="#46734d" font-size="12">serializable · supported</text><text x="1276" y="457" font-size="15" fill="#101527">What does serializable</text><text x="1276" y="477" font-size="15" fill="#101527">guarantee?</text></a><a href="#node-wrong_result"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">wrong_result · supported</text><text x="36" y="647" font-size="15" fill="#101527">How can two individually</text><text x="36" y="667" font-size="15" fill="#101527">correct transactions produce a</text><text x="36" y="687" font-size="15" fill="#101527">wrong result?</text></a><a href="#node-dirty"><rect x="954" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="966" y="241" fill="#46734d" font-size="12">dirty · supported</text><text x="966" y="267" font-size="15" fill="#101527">What is a dirty read?</text></a><a href="#node-nonrepeatable"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">nonrepeatable · supported</text><text x="346" y="457" font-size="15" fill="#101527">What is a nonrepeatable read?</text></a><a href="#node-phantom"><rect x="644" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="431" fill="#46734d" font-size="12">phantom · supported</text><text x="656" y="457" font-size="15" fill="#101527">What is a phantom read?</text></a><a href="#node-snapshot"><rect x="1264" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1276" y="241" fill="#46734d" font-size="12">snapshot · supported</text><text x="1276" y="267" font-size="15" fill="#101527">What is a read snapshot?</text></a><a href="#node-read_committed"><rect x="1574" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1586" y="431" fill="#46734d" font-size="12">read_committed · supported</text><text x="1586" y="457" font-size="15" fill="#101527">What does PostgreSQL Read</text><text x="1586" y="477" font-size="15" fill="#101527">Committed give an ordinary</text><text x="1586" y="497" font-size="15" fill="#101527">SELECT?</text></a><a href="#node-repeatable_read"><rect x="1884" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1896" y="431" fill="#46734d" font-size="12">repeatable_read · supported</text><text x="1896" y="457" font-size="15" fill="#101527">What does PostgreSQL Repeatable</text><text x="1896" y="477" font-size="15" fill="#101527">Read give ordinary reads?</text></a><a href="#node-levels"><rect x="954" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="966" y="621" fill="#46734d" font-size="12">levels · supported</text><text x="966" y="647" font-size="15" fill="#101527">What do isolation levels</text><text x="966" y="667" font-size="15" fill="#101527">specify?</text></a><a href="#node-locks"><rect x="954" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="966" y="431" fill="#46734d" font-size="12">locks · supported</text><text x="966" y="457" font-size="15" fill="#101527">How can a lock coordinate</text><text x="966" y="477" font-size="15" fill="#101527">conflicting operations?</text></a><a href="#node-mechanisms"><rect x="1574" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1586" y="621" fill="#46734d" font-size="12">mechanisms · supported</text><text x="1586" y="647" font-size="15" fill="#101527">Why is an isolation guarantee</text><text x="1586" y="667" font-size="15" fill="#101527">different from its</text><text x="1586" y="687" font-size="15" fill="#101527">implementation?</text></a><a href="#node-statement_kind"><rect x="1884" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1896" y="621" fill="#46734d" font-size="12">statement_kind · supported</text><text x="1896" y="647" font-size="15" fill="#101527">Why must a plain SELECT be</text><text x="1896" y="667" font-size="15" fill="#101527">distinguished from a locking</text><text x="1896" y="687" font-size="15" fill="#101527">read or UPDATE?</text></a><a href="#node-engine"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">engine · supported</text><text x="36" y="837" font-size="15" fill="#101527">Why is the isolation name alone</text><text x="36" y="857" font-size="15" fill="#101527">insufficient?</text></a><a href="#node-retry"><rect x="334" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="621" fill="#46734d" font-size="12">retry · supported</text><text x="346" y="647" font-size="15" fill="#101527">What must the application do</text><text x="346" y="667" font-size="15" fill="#101527">when concurrency control</text><text x="346" y="687" font-size="15" fill="#101527">rejects a transaction?</text></a><a href="#node-target"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">target · supported</text><text x="36" y="1027" font-size="15" fill="#101527">Why can individually correct</text><text x="36" y="1047" font-size="15" fill="#101527">operations fail together, and</text><text x="36" y="1067" font-size="15" fill="#101527">how do isolation levels help?</text></a><a href="#node-stable_not_serial"><rect x="1264" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1276" y="621" fill="#46734d" font-size="12">stable_not_serial · supported</text><text x="1276" y="647" font-size="15" fill="#101527">Why can a stable snapshot still</text><text x="1276" y="667" font-size="15" fill="#101527">allow a serialization anomaly?</text></a><a href="#node-correctness_limit"><rect x="644" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="621" fill="#46734d" font-size="12">correctness_limit · supported</text><text x="656" y="647" font-size="15" fill="#101527">When does serializable</text><text x="656" y="667" font-size="15" fill="#101527">isolation preserve an</text><text x="656" y="687" font-size="15" fill="#101527">application rule?</text></a></svg>