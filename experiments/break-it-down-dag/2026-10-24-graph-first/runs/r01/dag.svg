<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="2470" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M159,165 L159,185 L1268,185 L1268,394 L159,394 L159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>baseline → application: The application is defined as a configured input-to-output program, using the reader’s known API model.</title></a><a href="#edge-2"><path d="M159,545 C159,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>application → case: A case must distinguish inputs and context supplied to the application from grading information.</title></a><a href="#edge-3"><path d="M779,165 L779,185 L1280,185 L1280,774 L1089,774 L1089,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>objective → reference: Expected outcomes implement the stated support requirements.</title></a><a href="#edge-4"><path d="M159,735 C159,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>case → coverage: Representativeness concerns which reusable input situations are included.</title></a><a href="#edge-5"><path d="M159,735 C159,762 1089,763 1089,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>case → reference: Each expected outcome belongs to a particular input and context.</title></a><a href="#edge-6"><path d="M1089,925 C1089,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>reference → grader: The grader must compare actual behavior with an acceptable outcome or criterion.</title></a><a href="#edge-7"><path d="M159,1115 C159,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>grader → calibration: Agreement checks assess whether the grading rule captures informed human judgments.</title></a><a href="#edge-8"><path d="M159,545 L159,565 L1292,565 L1292,1154 L469,1154 L469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>application → run: The run executes one identified application configuration.</title></a><a href="#edge-9"><path d="M159,735 L159,755 L1304,755 L1304,1154 L469,1154 L469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>case → run: The run supplies case inputs and preserves separate grading information.</title></a><a href="#edge-10"><path d="M159,1115 C159,1142 469,1143 469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>grader → run: The run applies explicit assessment rules to its saved outputs.</title></a><a href="#edge-11"><path d="M469,1305 L469,1325 L1316,1325 L1316,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>run → aggregate: Pass counts and denominators come from recorded per-case run results.</title></a><a href="#edge-12"><path d="M159,925 L159,945 L1328,945 L1328,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>coverage → aggregate: The limit on generalization depends on which situations the cases cover.</title></a><a href="#edge-13"><path d="M159,1685 C159,1712 159,1713 159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>aggregate → comparison: Comparing scores requires knowing what each score summarizes and its scope.</title></a><a href="#edge-14"><path d="M159,1875 C159,1902 159,1903 159,1930" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>comparison → improvement: A claimed improvement needs evidence of gains and regressions under comparable conditions.</title></a><a href="#edge-15"><path d="M779,165 L779,185 L1340,185 L1340,394 L469,394 L469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>objective → action_outcome: Correct action outcomes depend on the defined authorization and task requirements.</title></a><a href="#edge-16"><path d="M159,925 L159,945 L1352,945 L1352,2104 L159,2104 L159,2120" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>coverage → start: Starting cases must include realistic and unusual situations.</title></a><a href="#edge-17"><path d="M159,2065 C159,2092 159,2093 159,2120" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>improvement → start: The starter workflow uses measured failures to revise and rerun.</title></a><a href="#edge-18"><path d="M469,545 L469,565 L1364,565 L1364,2104 L159,2104 L159,2120" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>action_outcome → start: A support workflow with actions must inspect their consequences separately from wording.</title></a><a href="#edge-19"><path d="M469,165 L469,185 L1376,185 L1376,2294 L159,2294 L159,2310" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>variability → target: The answer’s need for evals rests on unreliable inference from a few variable answers.</title></a><a href="#edge-20"><path d="M159,2255 C159,2282 159,2283 159,2310" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>start → target: The answer’s concrete starting method requires the evaluated support workflow.</title></a><a href="#edge-21"><path d="M159,1685 L159,1705 L1388,1705 L1388,2294 L159,2294 L159,2310" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>aggregate → target: The answer calls evals evidence, which requires knowing the score’s limited meaning.</title></a><a href="#edge-22"><path d="M159,165 C159,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>baseline → tool: Tools extend the reader’s known function input/output model to calls that retrieve or change records.</title></a><a href="#edge-23"><path d="M159,355 C159,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>tool → application: The tested application includes tool execution, whose behavior must be understood.</title></a><a href="#edge-24"><path d="M159,355 C159,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>tool → action_outcome: Resulting records distinguish effects of functions from the model’s words.</title></a><a href="#edge-25"><path d="M159,735 C159,762 469,763 469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>case → repeatability: Resetting requires the intended case-specific starting state.</title></a><a href="#edge-26"><path d="M469,1305 C469,1332 159,1333 159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>run → uncertainty: Repeated attempts and case observations are the objects whose scores can vary.</title></a><a href="#edge-27"><path d="M159,735 C159,762 779,763 779,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>case → heldout: A reserved set is a subset of reusable evaluation cases.</title></a><a href="#edge-28"><path d="M159,1495 L159,1515 L1400,1515 L1400,1724 L159,1724 L159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>uncertainty → comparison: The comparison’s small-gain caveat depends on the two sources of variation.</title></a><a href="#edge-29"><path d="M469,925 L469,945 L1412,945 L1412,1724 L159,1724 L159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>repeatability → comparison: Equivalent starting state is required by the comparison design.</title></a><a href="#edge-30"><path d="M779,925 L779,945 L1424,945 L1424,1724 L159,1724 L159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>heldout → comparison: The final comparison reserves cases unused in choosing the change.</title></a><a href="#edge-31"><path d="M159,1685 C159,1712 469,1713 469,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>aggregate → decision: A high score is a summary with limited scope, not a readiness guarantee.</title></a><a href="#edge-32"><path d="M779,165 L779,185 L1436,185 L1436,1724 L469,1724 L469,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>objective → decision: Acceptable failures and release conditions depend on the chosen requirements.</title></a><a href="#edge-33"><path d="M469,545 L469,565 L1448,565 L1448,1724 L469,1724 L469,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>action_outcome → decision: The unauthorized-action example requires distinguishing actual actions from replies.</title></a><a href="#edge-34"><path d="M159,1305 L159,1325 L1460,1325 L1460,1724 L469,1724 L469,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>calibration → decision: Readiness evidence depends on grading the intended behavior, not only scoring consistently.</title></a><a href="#edge-35"><path d="M469,1875 L469,1895 L1472,1895 L1472,2104 L159,2104 L159,2120" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>decision → start: The initial workflow must interpret its high average without treating it as a deployment guarantee.</title></a><a href="#edge-36"><path d="M1089,925 L1089,945 L1484,945 L1484,2104 L159,2104 L159,2120" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>reference → start: Preparing the starter dataset uses expert-checked expected behavior.</title></a><a href="#edge-37"><path d="M469,1305 L469,1325 L1496,1325 L1496,2104 L159,2104 L159,2120" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>run → start: The starter workflow explicitly executes cases and grades saved outputs.</title></a><a href="#edge-38"><path d="M469,1305 C469,1332 469,1333 469,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>run → incomplete: The recorded execution and grading steps identify which result is missing and where it failed.</title></a><a href="#edge-39"><path d="M469,1495 C469,1522 159,1523 159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>incomplete → aggregate: A meaningful denominator report must expose incomplete or ungraded attempts.</title></a><a href="#node-baseline"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">baseline · assumed</text><text x="36" y="77" font-size="15" fill="#101527">What can the reader already do?</text></a><a href="#node-application"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">application · supported</text><text x="36" y="457" font-size="15" fill="#101527">What exactly is the system</text><text x="36" y="477" font-size="15" fill="#101527">being tested?</text></a><a href="#node-variability"><rect x="334" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="51" fill="#46734d" font-size="12">variability · supported</text><text x="346" y="77" font-size="15" fill="#101527">Why are a few successful</text><text x="346" y="97" font-size="15" fill="#101527">conversations insufficient?</text></a><a href="#node-objective"><rect x="644" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="51" fill="#46734d" font-size="12">objective · supported</text><text x="656" y="77" font-size="15" fill="#101527">What would good support</text><text x="656" y="97" font-size="15" fill="#101527">behavior mean?</text></a><a href="#node-case"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">case · supported</text><text x="36" y="647" font-size="15" fill="#101527">What information belongs in a</text><text x="36" y="667" font-size="15" fill="#101527">test case?</text></a><a href="#node-coverage"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">coverage · supported</text><text x="36" y="837" font-size="15" fill="#101527">Which cases should be</text><text x="36" y="857" font-size="15" fill="#101527">collected?</text></a><a href="#node-reference"><rect x="954" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="966" y="811" fill="#46734d" font-size="12">reference · supported</text><text x="966" y="837" font-size="15" fill="#101527">How are acceptable outcomes</text><text x="966" y="857" font-size="15" fill="#101527">determined?</text></a><a href="#node-grader"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">grader · supported</text><text x="36" y="1027" font-size="15" fill="#101527">How does an output become a</text><text x="36" y="1047" font-size="15" fill="#101527">measurable result?</text></a><a href="#node-calibration"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">calibration · supported</text><text x="36" y="1217" font-size="15" fill="#101527">How do we know the grading rule</text><text x="36" y="1237" font-size="15" fill="#101527">measures what we intended?</text></a><a href="#node-run"><rect x="334" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1191" fill="#46734d" font-size="12">run · supported</text><text x="346" y="1217" font-size="15" fill="#101527">What happens in one evaluation</text><text x="346" y="1237" font-size="15" fill="#101527">run?</text></a><a href="#node-aggregate"><rect x="24" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1571" fill="#46734d" font-size="12">aggregate · supported</text><text x="36" y="1597" font-size="15" fill="#101527">What does a dataset score say?</text></a><a href="#node-comparison"><rect x="24" y="1740" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1761" fill="#46734d" font-size="12">comparison · supported</text><text x="36" y="1787" font-size="15" fill="#101527">How can an evaluation compare</text><text x="36" y="1807" font-size="15" fill="#101527">application changes?</text></a><a href="#node-improvement"><rect x="24" y="1930" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1951" fill="#46734d" font-size="12">improvement · supported</text><text x="36" y="1977" font-size="15" fill="#101527">How do results lead to</text><text x="36" y="1997" font-size="15" fill="#101527">improvement?</text></a><a href="#node-action_outcome"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">action_outcome · supported</text><text x="346" y="457" font-size="15" fill="#101527">How is a tool-using assistant</text><text x="346" y="477" font-size="15" fill="#101527">evaluated beyond its words?</text></a><a href="#node-start"><rect x="24" y="2120" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="2141" fill="#46734d" font-size="12">start · supported</text><text x="36" y="2167" font-size="15" fill="#101527">How would I start evaluating a</text><text x="36" y="2187" font-size="15" fill="#101527">customer-support assistant?</text></a><a href="#node-target"><rect x="24" y="2310" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="2331" fill="#46734d" font-size="12">target · supported</text><text x="36" y="2357" font-size="15" fill="#101527">Why do AI applications need</text><text x="36" y="2377" font-size="15" fill="#101527">evals, how do they work, and</text><text x="36" y="2397" font-size="15" fill="#101527">how can this reader start?</text></a><a href="#node-tool"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">tool · supported</text><text x="36" y="267" font-size="15" fill="#101527">What is a tool in this</text><text x="36" y="287" font-size="15" fill="#101527">application?</text></a><a href="#node-repeatability"><rect x="334" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="811" fill="#46734d" font-size="12">repeatability · supported</text><text x="346" y="837" font-size="15" fill="#101527">How can repeated attempts avoid</text><text x="346" y="857" font-size="15" fill="#101527">changing the test itself?</text></a><a href="#node-uncertainty"><rect x="24" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1381" fill="#46734d" font-size="12">uncertainty · supported</text><text x="36" y="1407" font-size="15" fill="#101527">Why might a higher score fail</text><text x="36" y="1427" font-size="15" fill="#101527">to show a dependable</text><text x="36" y="1447" font-size="15" fill="#101527">improvement?</text></a><a href="#node-heldout"><rect x="644" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="811" fill="#46734d" font-size="12">heldout · supported</text><text x="656" y="837" font-size="15" fill="#101527">Why reserve cases that were not</text><text x="656" y="857" font-size="15" fill="#101527">used to choose the change?</text></a><a href="#node-decision"><rect x="334" y="1740" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1761" fill="#46734d" font-size="12">decision · supported</text><text x="346" y="1787" font-size="15" fill="#101527">Does a high score mean the</text><text x="346" y="1807" font-size="15" fill="#101527">assistant is ready for</text><text x="346" y="1827" font-size="15" fill="#101527">customers?</text></a><a href="#node-incomplete"><rect x="334" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1381" fill="#46734d" font-size="12">incomplete · supported</text><text x="346" y="1407" font-size="15" fill="#101527">What if execution or grading</text><text x="346" y="1427" font-size="15" fill="#101527">cannot produce a usable result?</text></a></svg>