<svg xmlns="http://www.w3.org/2000/svg" width="1118" height="1710" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M159,165 C159,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>percent → conditional: Restricting a group is meaningful only once the denominator of its percentage is understood.</title></a><a href="#edge-2"><path d="M159,165 C159,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>percent → prior: A starting class share is a percentage of the entire incoming population.</title></a><a href="#edge-3"><path d="M159,355 C159,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>conditional → rates: Distinguishing the rates requires recognizing which condition selects the denominator.</title></a><a href="#edge-4"><path d="M469,355 L469,375 L958,375 L958,584 L159,584 L159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>prior → counts: The starting shares determine how many spam and legitimate cases can generate flags.</title></a><a href="#edge-5"><path d="M159,545 C159,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>rates → counts: Each class count must be multiplied by its own within-class flagging rate.</title></a><a href="#edge-6"><path d="M159,735 C159,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>counts → total: The total flagged count is formed from the two calculated class contributions.</title></a><a href="#edge-7"><path d="M159,925 C159,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>total → posterior: All flags supply the denominator for the spam share among flags.</title></a><a href="#edge-8"><path d="M159,355 L159,375 L970,375 L970,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>conditional → posterior: The requested reverse question conditions on flags rather than on actual spam.</title></a><a href="#edge-9"><path d="M159,1115 C159,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>posterior → basechange: Varying prevalence requires recomputing the same posterior calculation.</title></a><a href="#edge-10"><path d="M159,355 C159,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>conditional → words: Using a clue requires distinguishing its frequency within a class from the class share among clue-bearing messages.</title></a><a href="#edge-11"><path d="M469,545 C469,572 779,573 779,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>words → learn: Estimating clue probabilities requires specifying what the clue measures.</title></a><a href="#edge-12"><path d="M779,735 L779,755 L982,755 L982,1154 L469,1154 L469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>learn → scores: The class and feature estimates supply the numerical score inputs.</title></a><a href="#edge-13"><path d="M469,925 L469,945 L994,945 L994,1154 L469,1154 L469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>independence → scores: The simplified joint likelihood needs the conditional-independence assumption.</title></a><a href="#edge-14"><path d="M469,355 L469,375 L1006,375 L1006,1154 L469,1154 L469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>prior → scores: The relative starting class shares weight the evidence likelihoods.</title></a><a href="#edge-15"><path d="M469,1305 C469,1332 159,1333 159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>scores → limits: Reliability qualifications concern the normalized model scores and resulting classifications.</title></a><a href="#edge-16"><path d="M159,1115 L159,1135 L1018,1135 L1018,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>posterior → target: The reversed conditional resolves why 90% detection does not imply 90% trustworthy flags.</title></a><a href="#edge-17"><path d="M159,1305 L159,1325 L1030,1325 L1030,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>basechange → target: The question explicitly asks how the answer changes with prevalence.</title></a><a href="#edge-18"><path d="M469,1305 L469,1325 L1042,1325 L1042,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>scores → target: The classification rule connects one flag to multiple word clues.</title></a><a href="#edge-19"><path d="M159,1495 C159,1522 159,1523 159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>limits → target: The word-clue explanation must not imply its normalized scores are guaranteed real frequencies.</title></a><a href="#edge-20"><path d="M469,545 C469,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>words → joint: The combined event must first be defined by individual observed clues.</title></a><a href="#edge-21"><path d="M159,355 L159,375 L1054,375 L1054,584 L469,584 L469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>conditional → joint: The second clue is counted in the subgroup already selected by class and first clue.</title></a><a href="#edge-22"><path d="M469,735 C469,762 469,763 469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>joint → independence: Independence simplifies the general combination rule by dropping the dependency on previous clues.</title></a><a href="#edge-23"><path d="M159,1115 C159,1142 469,1143 469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>posterior → scores: Normalizing class scores applies the same reverse-conditional calculation used for flags.</title></a><a href="#node-percent"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">percent · assumed</text><text x="36" y="77" font-size="15" fill="#101527">How do percentages describe a</text><text x="36" y="97" font-size="15" fill="#101527">chosen group?</text></a><a href="#node-conditional"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">conditional · supported</text><text x="36" y="267" font-size="15" fill="#101527">What does a chance given</text><text x="36" y="287" font-size="15" fill="#101527">information mean?</text></a><a href="#node-prior"><rect x="334" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="241" fill="#46734d" font-size="12">prior · supported</text><text x="346" y="267" font-size="15" fill="#101527">What is the base rate before</text><text x="346" y="287" font-size="15" fill="#101527">the flag is known?</text></a><a href="#node-rates"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">rates · supported</text><text x="36" y="457" font-size="15" fill="#101527">Which groups do the two</text><text x="36" y="477" font-size="15" fill="#101527">flagging rates describe?</text></a><a href="#node-counts"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">counts · supported</text><text x="36" y="647" font-size="15" fill="#101527">How many flags arise from each</text><text x="36" y="667" font-size="15" fill="#101527">kind of mail?</text></a><a href="#node-total"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">total · supported</text><text x="36" y="837" font-size="15" fill="#101527">Why must both sources of flags</text><text x="36" y="857" font-size="15" fill="#101527">be counted?</text></a><a href="#node-posterior"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">posterior · supported</text><text x="36" y="1027" font-size="15" fill="#101527">What fraction of flags really</text><text x="36" y="1047" font-size="15" fill="#101527">comes from spam?</text></a><a href="#node-basechange"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">basechange · supported</text><text x="36" y="1217" font-size="15" fill="#101527">How does changing the starting</text><text x="36" y="1237" font-size="15" fill="#101527">spam share change the answer?</text></a><a href="#node-words"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">words · supported</text><text x="346" y="457" font-size="15" fill="#101527">How can a word serve as</text><text x="346" y="477" font-size="15" fill="#101527">evidence about spam?</text></a><a href="#node-learn"><rect x="644" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="621" fill="#46734d" font-size="12">learn · supported</text><text x="656" y="647" font-size="15" fill="#101527">Where do the word probabilities</text><text x="656" y="667" font-size="15" fill="#101527">and prior come from?</text></a><a href="#node-joint"><rect x="334" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="621" fill="#46734d" font-size="12">joint · supported</text><text x="346" y="647" font-size="15" fill="#101527">How is the chance of two clues</text><text x="346" y="667" font-size="15" fill="#101527">together found before assuming</text><text x="346" y="687" font-size="15" fill="#101527">independence?</text></a><a href="#node-independence"><rect x="334" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="811" fill="#46734d" font-size="12">independence · supported</text><text x="346" y="837" font-size="15" fill="#101527">When may individual word-clue</text><text x="346" y="857" font-size="15" fill="#101527">probabilities be multiplied?</text></a><a href="#node-scores"><rect x="334" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1191" fill="#46734d" font-size="12">scores · supported</text><text x="346" y="1217" font-size="15" fill="#101527">How do the prior and several</text><text x="346" y="1237" font-size="15" fill="#101527">word clues produce a</text><text x="346" y="1257" font-size="15" fill="#101527">classification?</text></a><a href="#node-limits"><rect x="24" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1381" fill="#46734d" font-size="12">limits · supported</text><text x="36" y="1407" font-size="15" fill="#101527">Does the classifier’s numerical</text><text x="36" y="1427" font-size="15" fill="#101527">probability guarantee real-</text><text x="36" y="1447" font-size="15" fill="#101527">world reliability?</text></a><a href="#node-target"><rect x="24" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1571" fill="#46734d" font-size="12">target · supported</text><text x="36" y="1597" font-size="15" fill="#101527">Why is a flag not almost</text><text x="36" y="1617" font-size="15" fill="#101527">certainly spam at a 1% base</text><text x="36" y="1637" font-size="15" fill="#101527">rate, how does the base rate</text><text x="36" y="1657" font-size="15" fill="#101527">change this, and how do words</text></a></svg>