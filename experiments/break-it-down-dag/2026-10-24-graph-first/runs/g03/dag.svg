<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="1710" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M159,165 C159,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sql_state → transaction: A transaction groups the SQL operations the reader already understands.</title></a><a href="#edge-2"><path d="M159,355 C159,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → atomicity: All-or-nothing applies to the grouped unit.</title></a><a href="#edge-3"><path d="M159,355 C159,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → overlap: Overlap concerns the steps of distinct transaction units.</title></a><a href="#edge-4"><path d="M159,355 C159,382 779,383 779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → serial: Serial order is an order of whole transactions.</title></a><a href="#edge-5"><path d="M469,545 C469,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>overlap → interference: The rule-breaking example requires interleaved decisions.</title></a><a href="#edge-6"><path d="M159,545 C159,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>atomicity → interference: The example must explain why successful grouped completion alone is insufficient.</title></a><a href="#edge-7"><path d="M469,545 C469,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>overlap → visibility: Overlapping work raises which concurrent changes a reader can see.</title></a><a href="#edge-8"><path d="M469,735 C469,762 469,763 469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>visibility → anomalies: Read anomalies are distinctions among observed versions and row sets.</title></a><a href="#edge-9"><path d="M779,545 L779,565 L958,565 L958,774 L469,774 L469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serial → anomalies: Serialization anomalies are defined relative to serial outcomes.</title></a><a href="#edge-10"><path d="M469,735 C469,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>visibility → snapshot: A snapshot restricts visible versions to a particular database state.</title></a><a href="#edge-11"><path d="M469,925 C469,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>anomalies → levels: Levels are described by the anomalies they exclude.</title></a><a href="#edge-12"><path d="M159,925 C159,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → levels: Actual read behavior requires snapshot timing.</title></a><a href="#edge-13"><path d="M159,925 C159,952 469,953 469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → snapshot_limit: The failure concerns transactions using stable snapshots.</title></a><a href="#edge-14"><path d="M159,735 L159,755 L970,755 L970,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>interference → snapshot_limit: The limit must be shown by a concrete rule-breaking combination.</title></a><a href="#edge-15"><path d="M779,545 L779,565 L982,565 L982,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serial → snapshot_limit: The outcome must be compared with possible serial executions.</title></a><a href="#edge-16"><path d="M159,925 C159,952 779,953 779,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → mechanisms: Versions provide one way of implementing read consistency.</title></a><a href="#edge-17"><path d="M469,545 L469,565 L994,565 L994,964 L779,964 L779,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>overlap → mechanisms: Locks and checks control interference from overlapping work.</title></a><a href="#edge-18"><path d="M779,1115 C779,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>mechanisms → engine_details: Product differences concern concrete concurrency-control implementations.</title></a><a href="#edge-19"><path d="M159,1115 C159,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>levels → engine_details: Level labels must be separated from actual product guarantees.</title></a><a href="#edge-20"><path d="M779,735 C779,762 779,763 779,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serializable → retries: Preserving serial outcomes can require rejecting conflicting work.</title></a><a href="#edge-21"><path d="M159,1305 C159,1332 159,1333 159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>engine_details → choice: Correct selection requires the specific engine and statements.</title></a><a href="#edge-22"><path d="M779,925 L779,945 L1006,945 L1006,1344 L159,1344 L159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>retries → choice: Correct transaction handling includes failure recovery.</title></a><a href="#edge-23"><path d="M779,735 L779,755 L1018,755 L1018,1344 L159,1344 L159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serializable → choice: The intended invariant determines required guarantees.</title></a><a href="#edge-24"><path d="M159,735 L159,755 L1030,755 L1030,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>interference → target: Explains how concurrency invalidates separately sound decisions.</title></a><a href="#edge-25"><path d="M159,1495 C159,1522 159,1523 159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>choice → target: Explains how isolation helps and how to apply it.</title></a><a href="#edge-26"><path d="M159,165 C159,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sql_state → correctness: A rule refers to the rows and values the reader already recognizes.</title></a><a href="#edge-27"><path d="M469,355 C469,382 779,383 779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>correctness → serial: The preservation argument needs a definition of individually correct operations.</title></a><a href="#edge-28"><path d="M469,355 L469,375 L1042,375 L1042,584 L159,584 L159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>correctness → interference: Calling the combined outcome wrong requires the shared rule.</title></a><a href="#edge-29"><path d="M779,545 C779,572 779,573 779,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serial → serializable: Serializable is defined by equivalence to a serial order.</title></a><a href="#edge-30"><path d="M469,1115 L469,1135 L1054,1135 L1054,1344 L159,1344 L159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot_limit → choice: A safe choice must account for failures that stable reads alone do not exclude.</title></a><a href="#edge-31"><path d="M779,545 L779,565 L1066,565 L1066,964 L779,964 L779,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serial → mechanisms: Conflict-checking explanations refer to compatibility with a serial order.</title></a><a href="#node-sql_state"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">sql_state · assumed</text><text x="36" y="77" font-size="15" fill="#101527">What SQL knowledge can the</text><text x="36" y="97" font-size="15" fill="#101527">explanation assume?</text></a><a href="#node-correctness"><rect x="334" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="241" fill="#46734d" font-size="12">correctness · supported</text><text x="346" y="267" font-size="15" fill="#101527">What makes a database operation</text><text x="346" y="287" font-size="15" fill="#101527">correct for an application?</text></a><a href="#node-transaction"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">transaction · supported</text><text x="36" y="267" font-size="15" fill="#101527">What operations belong to a</text><text x="36" y="287" font-size="15" fill="#101527">transaction, and what do commit</text><text x="36" y="307" font-size="15" fill="#101527">and rollback mean?</text></a><a href="#node-atomicity"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">atomicity · supported</text><text x="36" y="457" font-size="15" fill="#101527">What does all-or-nothing</text><text x="36" y="477" font-size="15" fill="#101527">completion guarantee?</text></a><a href="#node-overlap"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">overlap · supported</text><text x="346" y="457" font-size="15" fill="#101527">How can two transactions</text><text x="346" y="477" font-size="15" fill="#101527">overlap even when each</text><text x="346" y="497" font-size="15" fill="#101527">statement executes correctly?</text></a><a href="#node-serial"><rect x="644" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="431" fill="#46734d" font-size="12">serial · supported</text><text x="656" y="457" font-size="15" fill="#101527">What would executing whole</text><text x="656" y="477" font-size="15" fill="#101527">transactions one at a time</text><text x="656" y="497" font-size="15" fill="#101527">mean?</text></a><a href="#node-interference"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">interference · supported</text><text x="36" y="647" font-size="15" fill="#101527">How can overlapping,</text><text x="36" y="667" font-size="15" fill="#101527">individually valid decisions</text><text x="36" y="687" font-size="15" fill="#101527">violate a shared rule?</text></a><a href="#node-visibility"><rect x="334" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="621" fill="#46734d" font-size="12">visibility · supported</text><text x="346" y="647" font-size="15" fill="#101527">Which version of a row can a</text><text x="346" y="667" font-size="15" fill="#101527">read observe?</text></a><a href="#node-anomalies"><rect x="334" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="811" fill="#46734d" font-size="12">anomalies · supported</text><text x="346" y="837" font-size="15" fill="#101527">How do dirty, changed-value,</text><text x="346" y="857" font-size="15" fill="#101527">changed-set, and serialization</text><text x="346" y="877" font-size="15" fill="#101527">anomalies differ?</text></a><a href="#node-snapshot"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">snapshot · supported</text><text x="36" y="837" font-size="15" fill="#101527">How can a read see a stable</text><text x="36" y="857" font-size="15" fill="#101527">database state while another</text><text x="36" y="877" font-size="15" fill="#101527">transaction writes?</text></a><a href="#node-levels"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">levels · supported</text><text x="36" y="1027" font-size="15" fill="#101527">What protections do the named</text><text x="36" y="1047" font-size="15" fill="#101527">isolation levels promise?</text></a><a href="#node-snapshot_limit"><rect x="334" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1001" fill="#46734d" font-size="12">snapshot_limit · supported</text><text x="346" y="1027" font-size="15" fill="#101527">Why can a stable transaction</text><text x="346" y="1047" font-size="15" fill="#101527">snapshot still allow a wrong</text><text x="346" y="1067" font-size="15" fill="#101527">combined result?</text></a><a href="#node-serializable"><rect x="644" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="621" fill="#46734d" font-size="12">serializable · supported</text><text x="656" y="647" font-size="15" fill="#101527">What does serializable</text><text x="656" y="667" font-size="15" fill="#101527">execution guarantee?</text></a><a href="#node-mechanisms"><rect x="644" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="1001" fill="#46734d" font-size="12">mechanisms · supported</text><text x="656" y="1027" font-size="15" fill="#101527">How do snapshots, locks, and</text><text x="656" y="1047" font-size="15" fill="#101527">conflict checks implement</text><text x="656" y="1067" font-size="15" fill="#101527">isolation?</text></a><a href="#node-engine_details"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">engine_details · supported</text><text x="36" y="1217" font-size="15" fill="#101527">Why do engine and statement</text><text x="36" y="1237" font-size="15" fill="#101527">type matter beyond the level</text><text x="36" y="1257" font-size="15" fill="#101527">name?</text></a><a href="#node-retries"><rect x="644" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="811" fill="#46734d" font-size="12">retries · supported</text><text x="656" y="837" font-size="15" fill="#101527">Why must applications sometimes</text><text x="656" y="857" font-size="15" fill="#101527">retry a whole transaction?</text></a><a href="#node-choice"><rect x="24" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1381" fill="#46734d" font-size="12">choice · supported</text><text x="36" y="1407" font-size="15" fill="#101527">How should correctness</text><text x="36" y="1427" font-size="15" fill="#101527">requirements guide the</text><text x="36" y="1447" font-size="15" fill="#101527">isolation choice?</text></a><a href="#node-target"><rect x="24" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1571" fill="#46734d" font-size="12">target · supported</text><text x="36" y="1597" font-size="15" fill="#101527">Why can concurrent correct</text><text x="36" y="1617" font-size="15" fill="#101527">operations yield a wrong</text><text x="36" y="1637" font-size="15" fill="#101527">result, and how do isolation</text><text x="36" y="1657" font-size="15" fill="#101527">levels help?</text></a></svg>