<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="1900" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M159,165 C159,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>percentages → prior: Without percentages as group shares, 1% cannot specify the starting class sizes.</title></a><a href="#edge-2"><path d="M469,165 C469,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>partition → prior: Without complementary classes, 1% spam would not establish 99% legitimate.</title></a><a href="#edge-3"><path d="M159,165 C159,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>percentages → conditional: Without ratios within a group, the conditioned fraction has no denominator interpretation.</title></a><a href="#edge-4"><path d="M159,355 C159,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>conditional → flag_rates: Without identifying the conditioned group, the two given rates can be mistaken for the requested reversed rate.</title></a><a href="#edge-5"><path d="M469,355 L469,375 L958,375 L958,584 L159,584 L159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>prior → joint_counts: Without class sizes, within-class flag rates cannot produce population contributions.</title></a><a href="#edge-6"><path d="M159,545 C159,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>flag_rates → joint_counts: Without the separate within-class rates, class counts cannot determine true and false flags.</title></a><a href="#edge-7"><path d="M469,165 L469,185 L970,185 L970,774 L159,774 L159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>partition → all_flags: Without disjoint exhaustive classes, adding the two contributions could double count or omit flags.</title></a><a href="#edge-8"><path d="M159,735 C159,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>joint_counts → all_flags: Without both contributions, the total flag denominator is missing.</title></a><a href="#edge-9"><path d="M159,925 C159,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>all_flags → posterior: Without the total flagged group, dividing true flags produces the wrong denominator.</title></a><a href="#edge-10"><path d="M159,355 L159,375 L982,375 L982,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>conditional → posterior: Without conditioning on the observed flag, the requested fraction cannot be identified.</title></a><a href="#edge-11"><path d="M159,355 C159,382 779,383 779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>conditional → training: Without within-class conditioning, one might count overall word frequency instead of class-specific frequencies.</title></a><a href="#edge-12"><path d="M159,355 C159,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>conditional → independence: Without conditioning, independence within a fixed class is easily confused with unconditional word independence.</title></a><a href="#edge-13"><path d="M469,1305 C469,1332 159,1333 159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>word_clue → word_scores: Without the single-clue class update, multiplying class evidence scores and then normalizing lacks its inference meaning.</title></a><a href="#edge-14"><path d="M469,545 L469,565 L994,565 L994,1344 L159,1344 L159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>independence → word_scores: Without conditional independence, the joint feature probability cannot generally be replaced by separate factors.</title></a><a href="#edge-15"><path d="M779,545 L779,565 L1006,565 L1006,1344 L159,1344 L159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>training → word_scores: Without learned class-specific feature probabilities and priors, the score factors have no operational values.</title></a><a href="#edge-16"><path d="M159,1495 C159,1522 159,1523 159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>word_scores → probability_limit: Without knowing the score is produced by an assumed factorization, its distinction from empirically calibrated confidence is unexplained.</title></a><a href="#edge-17"><path d="M159,1305 L159,1325 L1018,1325 L1018,1724 L159,1724 L159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>base_rate_change → target: Without base-rate dependence, the answer cannot explain why the same 90% detection rate gives different confidence.</title></a><a href="#edge-18"><path d="M159,1495 L159,1515 L1030,1515 L1030,1724 L159,1724 L159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>word_scores → target: Without combined word-feature scores, the answer cannot connect the flag example to naive Bayes spam classification.</title></a><a href="#edge-19"><path d="M159,1685 C159,1712 159,1713 159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>probability_limit → target: Without the model-versus-observed confidence limit, the answer could incorrectly treat all computed scores as reliable probabilities.</title></a><a href="#edge-20"><path d="M159,355 L159,375 L1042,375 L1042,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>conditional → update_rule: The reversed question requires selecting the evidence-bearing group as the denominator.</title></a><a href="#edge-21"><path d="M159,735 L159,755 L1054,755 L1054,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>joint_counts → update_rule: The numerator requires multiplying the prior by the within-class evidence rate.</title></a><a href="#edge-22"><path d="M159,925 C159,952 469,953 469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>all_flags → update_rule: The denominator must include evidence from both mutually exclusive classes.</title></a><a href="#edge-23"><path d="M469,1115 C469,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>update_rule → base_rate_change: The dependence on p follows from the weighted and normalized two-class relationship.</title></a><a href="#edge-24"><path d="M469,1115 C469,1142 469,1143 469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>update_rule → word_clue: The word is an instance of evidence; without the update rule, within-class word rates cannot be reversed to a spam fraction.</title></a><a href="#edge-25"><path d="M469,355 C469,382 779,383 779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>prior → training: Without a starting class proportion, the class-frequency estimate has no role in the model.</title></a><a href="#edge-26"><path d="M159,1115 L159,1135 L1066,1135 L1066,1724 L159,1724 L159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>posterior → target: The target asks for the numerical answer at the stipulated 1% base rate.</title></a><a href="#node-percentages"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">percentages · assumed</text><text x="36" y="77" font-size="15" fill="#101527">How do I turn a percentage into</text><text x="36" y="97" font-size="15" fill="#101527">a count?</text></a><a href="#node-partition"><rect x="334" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="51" fill="#646c77" font-size="12">partition · assumed</text><text x="346" y="77" font-size="15" fill="#101527">What are the possible actual</text><text x="346" y="97" font-size="15" fill="#101527">message classes?</text></a><a href="#node-prior"><rect x="334" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="241" fill="#46734d" font-size="12">prior · supported</text><text x="346" y="267" font-size="15" fill="#101527">What does a 1% spam base rate</text><text x="346" y="287" font-size="15" fill="#101527">describe?</text></a><a href="#node-conditional"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">conditional · supported</text><text x="36" y="267" font-size="15" fill="#101527">What does a probability given</text><text x="36" y="287" font-size="15" fill="#101527">information mean?</text></a><a href="#node-flag_rates"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">flag_rates · supported</text><text x="36" y="457" font-size="15" fill="#101527">Which groups do the 90% and 10%</text><text x="36" y="477" font-size="15" fill="#101527">flag rates count?</text></a><a href="#node-joint_counts"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">joint_counts · supported</text><text x="36" y="647" font-size="15" fill="#101527">How many flagged messages come</text><text x="36" y="667" font-size="15" fill="#101527">from each actual class?</text></a><a href="#node-all_flags"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">all_flags · supported</text><text x="36" y="837" font-size="15" fill="#101527">How many messages belong to the</text><text x="36" y="857" font-size="15" fill="#101527">flagged group?</text></a><a href="#node-posterior"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">posterior · supported</text><text x="36" y="1027" font-size="15" fill="#101527">What fraction of flagged</text><text x="36" y="1047" font-size="15" fill="#101527">messages is actually spam?</text></a><a href="#node-update_rule"><rect x="334" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1001" fill="#46734d" font-size="12">update_rule · supported</text><text x="346" y="1027" font-size="15" fill="#101527">What general rule reverses the</text><text x="346" y="1047" font-size="15" fill="#101527">direction of the given</text><text x="346" y="1067" font-size="15" fill="#101527">probabilities?</text></a><a href="#node-base_rate_change"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">base_rate_change · supported</text><text x="36" y="1217" font-size="15" fill="#101527">How does a different spam base</text><text x="36" y="1237" font-size="15" fill="#101527">rate change that answer?</text></a><a href="#node-word_clue"><rect x="334" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1191" fill="#46734d" font-size="12">word_clue · supported</text><text x="346" y="1217" font-size="15" fill="#101527">How can a word act like a flag?</text></a><a href="#node-training"><rect x="644" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="431" fill="#46734d" font-size="12">training · supported</text><text x="656" y="457" font-size="15" fill="#101527">Where do the word frequencies</text><text x="656" y="477" font-size="15" fill="#101527">and priors come from?</text></a><a href="#node-independence"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">independence · supported</text><text x="346" y="457" font-size="15" fill="#101527">Why can naive Bayes multiply</text><text x="346" y="477" font-size="15" fill="#101527">separate word-clue</text><text x="346" y="497" font-size="15" fill="#101527">probabilities?</text></a><a href="#node-word_scores"><rect x="24" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1381" fill="#46734d" font-size="12">word_scores · supported</text><text x="36" y="1407" font-size="15" fill="#101527">How does naive Bayes combine</text><text x="36" y="1427" font-size="15" fill="#101527">several clues with a base rate?</text></a><a href="#node-probability_limit"><rect x="24" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1571" fill="#46734d" font-size="12">probability_limit · supported</text><text x="36" y="1597" font-size="15" fill="#101527">Why might a naive Bayes score</text><text x="36" y="1617" font-size="15" fill="#101527">fail to describe real-world</text><text x="36" y="1637" font-size="15" fill="#101527">confidence?</text></a><a href="#node-target"><rect x="24" y="1740" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1761" fill="#46734d" font-size="12">target · supported</text><text x="36" y="1787" font-size="15" fill="#101527">Why is a flag not almost</text><text x="36" y="1807" font-size="15" fill="#101527">certainly spam, and how do base</text><text x="36" y="1827" font-size="15" fill="#101527">rates and words determine the</text><text x="36" y="1847" font-size="15" fill="#101527">answer?</text></a></svg>