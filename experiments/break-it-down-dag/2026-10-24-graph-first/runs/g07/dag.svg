<svg xmlns="http://www.w3.org/2000/svg" width="2108" height="1330" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M469,165 C469,192 779,193 779,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>arithmetic → invariant: Without adding balances, the motivating correctness rule is not interpretable.</title></a><a href="#edge-2"><path d="M159,165 C159,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sql → transaction: The reader must recognize statements before understanding how several statements form one unit.</title></a><a href="#edge-3"><path d="M159,355 C159,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → atomicity: Without transaction boundaries, there is no defined group whose success must be all or nothing.</title></a><a href="#edge-4"><path d="M159,355 C159,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → concurrency: Overlapping units must be identified before describing their interleaved execution.</title></a><a href="#edge-5"><path d="M159,165 C159,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sql → dependency: A SELECT result and a subsequent write must be understood to explain a read-dependent decision.</title></a><a href="#edge-6"><path d="M159,355 C159,382 779,383 779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → snapshot: Committed versions and own writes require distinguishing transaction boundaries and completion.</title></a><a href="#edge-7"><path d="M469,355 L469,375 L1888,375 L1888,584 L1399,584 L1399,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>dependency → anomaly: Without the read-to-decision dependency, the reason independently valid writes become jointly invalid is missing.</title></a><a href="#edge-8"><path d="M779,545 C779,572 1399,573 1399,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → anomaly: The constructed anomaly depends on both transactions deciding from the same earlier committed state.</title></a><a href="#edge-9"><path d="M779,355 L779,375 L1900,375 L1900,584 L1399,584 L1399,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>invariant → anomaly: An invalid combined result requires an explicit application rule.</title></a><a href="#edge-10"><path d="M1399,545 C1399,572 1399,573 1399,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serial → anomaly: The example compares concurrent outcomes with both possible complete transaction orderings.</title></a><a href="#edge-11"><path d="M159,545 L159,565 L1912,565 L1912,774 L159,774 L159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>atomicity → atomicity_limit: The distinction requires specifying exactly what all-or-nothing success already promises.</title></a><a href="#edge-12"><path d="M1399,735 C1399,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>anomaly → atomicity_limit: The counterexample shows a bad concurrent outcome despite both complete units committing.</title></a><a href="#edge-13"><path d="M1399,545 C1399,572 1709,573 1709,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serial → serializable: Without serial execution there is no reference behavior for the equivalence guarantee.</title></a><a href="#edge-14"><path d="M159,355 C159,382 1089,383 1089,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → dirty: Uncommitted data is meaningful only after commit boundaries are defined.</title></a><a href="#edge-15"><path d="M469,545 C469,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>concurrency → nonrepeatable: The changed value comes from another overlapping transaction committing between reads.</title></a><a href="#edge-16"><path d="M159,165 L159,185 L1924,185 L1924,584 L159,584 L159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sql → phantom: The distinction concerns the set of rows matching a WHERE condition.</title></a><a href="#edge-17"><path d="M469,545 C469,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>concurrency → phantom: A second transaction changes the matching set between the first transaction’s queries.</title></a><a href="#edge-18"><path d="M1089,545 L1089,565 L1936,565 L1936,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>dirty → levels: Avoiding uncommitted observations is one protection used to compare named levels.</title></a><a href="#edge-19"><path d="M469,735 L469,755 L1948,755 L1948,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>nonrepeatable → levels: Reread stability is a different protection and cannot be inferred just from preventing dirty reads.</title></a><a href="#edge-20"><path d="M159,735 L159,755 L1960,755 L1960,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>phantom → levels: Row-set stability must be distinguished from rereading one unchanged row.</title></a><a href="#edge-21"><path d="M1709,735 L1709,755 L1972,755 L1972,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serializable → levels: The strongest comparison requires serial equivalence, beyond the three read phenomena.</title></a><a href="#edge-22"><path d="M779,545 C779,572 1089,573 1089,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → read_committed: The scope of a snapshot explains why statements can disagree despite each avoiding dirty data.</title></a><a href="#edge-23"><path d="M779,545 L779,565 L1984,565 L1984,774 L469,774 L469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → repeatable_read: A snapshot spanning statements explains stable reads without assuming sequential execution.</title></a><a href="#edge-24"><path d="M1399,735 C1399,762 469,763 469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>anomaly → repeatable_read: Stable snapshots alone do not establish serial equivalence; the anomaly demonstrates that gap.</title></a><a href="#edge-25"><path d="M779,545 C779,572 779,573 779,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>snapshot → mechanisms: Version-based reads are one concrete mechanism and must be understood before comparison with blocking and detection.</title></a><a href="#edge-26"><path d="M469,355 L469,375 L1996,375 L1996,774 L779,774 L779,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>dependency → retry: Rerunning reads and decisions is necessary because retrying only the write preserves the original stale decision.</title></a><a href="#edge-27"><path d="M159,925 L159,945 L2008,945 L2008,1154 L159,1154 L159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>atomicity_limit → target: This supplies the causal answer to why wrapping operations in transactions is insufficient.</title></a><a href="#edge-28"><path d="M159,1115 C159,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>levels → target: This explains how available guarantees constrain different failures.</title></a><a href="#edge-29"><path d="M159,355 C159,382 1399,383 1399,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>transaction → serial: Whole transaction boundaries must be known before specifying noninterleaving transaction order.</title></a><a href="#edge-30"><path d="M1089,735 L1089,755 L2020,755 L2020,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>read_committed → levels: The comparison explicitly uses statement-level visibility to explain Read Committed protections.</title></a><a href="#edge-31"><path d="M469,925 C469,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>repeatable_read → levels: The comparison explicitly distinguishes stable reads and PostgreSQL’s phantom protection from serial equivalence.</title></a><a href="#edge-32"><path d="M469,545 C469,572 779,573 779,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>concurrency → mechanisms: Blocking or rejecting an operation requires identifying the other overlapping operation whose interaction is controlled.</title></a><a href="#edge-33"><path d="M1709,735 C1709,762 779,763 779,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>serializable → retry: The retry consequence follows from rejecting transactions to preserve serial equivalence.</title></a><a href="#edge-34"><path d="M779,735 L779,755 L2032,755 L2032,1154 L159,1154 L159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>mechanisms → target: The requested distinction between guarantees and implementations requires explaining version retention, blocking, and dependency checking.</title></a><a href="#edge-35"><path d="M779,925 L779,945 L2044,945 L2044,1154 L159,1154 L159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>retry → target: Serializable helps only if the application handles rejected attempts and recomputes its decisions.</title></a><a href="#node-sql"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">sql · assumed</text><text x="36" y="77" font-size="15" fill="#101527">What SQL knowledge can this</text><text x="36" y="97" font-size="15" fill="#101527">explanation assume?</text></a><a href="#node-arithmetic"><rect x="334" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="51" fill="#646c77" font-size="12">arithmetic · assumed</text><text x="346" y="77" font-size="15" fill="#101527">What numerical reasoning can</text><text x="346" y="97" font-size="15" fill="#101527">this explanation assume?</text></a><a href="#node-invariant"><rect x="644" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="241" fill="#46734d" font-size="12">invariant · supported</text><text x="656" y="267" font-size="15" fill="#101527">What makes a database result</text><text x="656" y="287" font-size="15" fill="#101527">correct?</text></a><a href="#node-transaction"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">transaction · supported</text><text x="36" y="267" font-size="15" fill="#101527">What does a transaction group?</text></a><a href="#node-atomicity"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">atomicity · supported</text><text x="36" y="457" font-size="15" fill="#101527">What failure does all-or-</text><text x="36" y="477" font-size="15" fill="#101527">nothing execution prevent?</text></a><a href="#node-concurrency"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">concurrency · supported</text><text x="346" y="457" font-size="15" fill="#101527">What does concurrent execution</text><text x="346" y="477" font-size="15" fill="#101527">mean?</text></a><a href="#node-serial"><rect x="1264" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1276" y="431" fill="#46734d" font-size="12">serial · supported</text><text x="1276" y="457" font-size="15" fill="#101527">What is a serial execution?</text></a><a href="#node-dependency"><rect x="334" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="241" fill="#46734d" font-size="12">dependency · supported</text><text x="346" y="267" font-size="15" fill="#101527">Why can a read affect the</text><text x="346" y="287" font-size="15" fill="#101527">correctness of a later write?</text></a><a href="#node-snapshot"><rect x="644" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="431" fill="#46734d" font-size="12">snapshot · supported</text><text x="656" y="457" font-size="15" fill="#101527">What does reading a snapshot</text><text x="656" y="477" font-size="15" fill="#101527">mean?</text></a><a href="#node-anomaly"><rect x="1264" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1276" y="621" fill="#46734d" font-size="12">anomaly · supported</text><text x="1276" y="647" font-size="15" fill="#101527">How can two individually valid</text><text x="1276" y="667" font-size="15" fill="#101527">transactions produce an invalid</text><text x="1276" y="687" font-size="15" fill="#101527">combined result?</text></a><a href="#node-atomicity_limit"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">atomicity_limit · supported</text><text x="36" y="837" font-size="15" fill="#101527">Why do transaction boundaries</text><text x="36" y="857" font-size="15" fill="#101527">alone fail to prevent this?</text></a><a href="#node-serializable"><rect x="1574" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1586" y="621" fill="#46734d" font-size="12">serializable · supported</text><text x="1586" y="647" font-size="15" fill="#101527">What extra promise does</text><text x="1586" y="667" font-size="15" fill="#101527">serializable isolation make?</text></a><a href="#node-dirty"><rect x="954" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="966" y="431" fill="#46734d" font-size="12">dirty · supported</text><text x="966" y="457" font-size="15" fill="#101527">What is a dirty read?</text></a><a href="#node-nonrepeatable"><rect x="334" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="621" fill="#46734d" font-size="12">nonrepeatable · supported</text><text x="346" y="647" font-size="15" fill="#101527">What is a nonrepeatable read?</text></a><a href="#node-phantom"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">phantom · supported</text><text x="36" y="647" font-size="15" fill="#101527">What is a phantom read?</text></a><a href="#node-levels"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">levels · supported</text><text x="36" y="1027" font-size="15" fill="#101527">How do the four named isolation</text><text x="36" y="1047" font-size="15" fill="#101527">levels compare?</text></a><a href="#node-read_committed"><rect x="954" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="966" y="621" fill="#46734d" font-size="12">read_committed · supported</text><text x="966" y="647" font-size="15" fill="#101527">What does PostgreSQL Read</text><text x="966" y="667" font-size="15" fill="#101527">Committed guarantee for</text><text x="966" y="687" font-size="15" fill="#101527">ordinary SELECT?</text></a><a href="#node-repeatable_read"><rect x="334" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="811" fill="#46734d" font-size="12">repeatable_read · supported</text><text x="346" y="837" font-size="15" fill="#101527">What does PostgreSQL Repeatable</text><text x="346" y="857" font-size="15" fill="#101527">Read add?</text></a><a href="#node-mechanisms"><rect x="644" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="621" fill="#46734d" font-size="12">mechanisms · supported</text><text x="656" y="647" font-size="15" fill="#101527">How can databases enforce</text><text x="656" y="667" font-size="15" fill="#101527">isolation guarantees?</text></a><a href="#node-retry"><rect x="644" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="811" fill="#46734d" font-size="12">retry · supported</text><text x="656" y="837" font-size="15" fill="#101527">What must an application do</text><text x="656" y="857" font-size="15" fill="#101527">when serialization checking</text><text x="656" y="877" font-size="15" fill="#101527">rejects a transaction?</text></a><a href="#node-target"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">target · supported</text><text x="36" y="1217" font-size="15" fill="#101527">Why can individually correct</text><text x="36" y="1237" font-size="15" fill="#101527">concurrent operations go wrong,</text><text x="36" y="1257" font-size="15" fill="#101527">and how do isolation levels</text><text x="36" y="1277" font-size="15" fill="#101527">help?</text></a></svg>