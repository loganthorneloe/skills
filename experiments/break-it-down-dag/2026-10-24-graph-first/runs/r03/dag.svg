<svg xmlns="http://www.w3.org/2000/svg" width="1846" height="1710" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M159,165 C159,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>chance → condition: Restricting a probability requires knowing which population a fraction describes.</title></a><a href="#edge-2"><path d="M159,355 C159,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>condition → given: The 90% and 10% inputs require distinct conditional denominators.</title></a><a href="#edge-3"><path d="M159,165 C159,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>chance → prior: The starting spam fraction requires the population meaning of probability.</title></a><a href="#edge-4"><path d="M159,545 C159,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>given → counts: Expected true and false flag counts need the supplied within-class rates and 1% prevalence.</title></a><a href="#edge-5"><path d="M159,735 C159,762 469,763 469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>counts → total: The total flagged count needs contributions from both true and false flags.</title></a><a href="#edge-6"><path d="M469,925 C469,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>total → answer: The spam fraction among flags needs the complete flagged denominator.</title></a><a href="#edge-7"><path d="M159,735 L159,755 L1578,755 L1578,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>counts → answer: The spam fraction among flags needs the true-flag numerator of 90.</title></a><a href="#edge-8"><path d="M159,355 L159,375 L1590,375 L1590,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>condition → answer: Interpreting 90/1080 as spam among flags requires restricting to flagged mail.</title></a><a href="#edge-9"><path d="M469,355 L469,375 L1602,375 L1602,584 L469,584 L469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>prior → bayes: The general formula needs p and its legitimate complement 1−p.</title></a><a href="#edge-10"><path d="M159,355 L159,375 L1614,375 L1614,584 L469,584 L469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>condition → bayes: The likelihood and posterior terms require distinguishing conditional populations.</title></a><a href="#edge-11"><path d="M469,735 C469,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>bayes → vary: Changing the prior requires the posterior formula containing p.</title></a><a href="#edge-12"><path d="M159,545 L159,565 L1626,565 L1626,774 L159,774 L159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>given → vary: The numerical base-rate comparison fixes the supplied 90% and 10% rates.</title></a><a href="#edge-13"><path d="M469,735 C469,762 779,763 779,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>bayes → word: Interpreting word occurrence as evidence requires the general clue update rule.</title></a><a href="#edge-14"><path d="M469,165 L469,185 L1638,185 L1638,394 L779,394 L779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>features → estimate: Estimating a word occurrence rate requires specifying binary feature representation.</title></a><a href="#edge-15"><path d="M159,355 C159,382 779,383 779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>condition → estimate: Per-class word rates require restricting counts to each labeled class.</title></a><a href="#edge-16"><path d="M469,165 L469,185 L1650,185 L1650,394 L1089,394 L1089,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>features → joint: The full message pattern requires defined present/absent feature values.</title></a><a href="#edge-17"><path d="M159,355 C159,382 1089,383 1089,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>condition → joint: The required joint likelihood is a pattern frequency within a fixed class.</title></a><a href="#edge-18"><path d="M1089,545 C1089,572 779,573 779,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>joint → independence: The multiplication assumption answers how to estimate the otherwise undetermined full-pattern likelihood.</title></a><a href="#edge-19"><path d="M779,735 C779,762 1089,763 1089,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>independence → scores: Multiplying individual feature probabilities in a class score requires conditional independence.</title></a><a href="#edge-20"><path d="M469,735 C469,762 1089,763 1089,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>bayes → scores: Prior-weighted likelihood scores and their normalization use Bayes’ rule.</title></a><a href="#edge-21"><path d="M779,735 L779,755 L1662,755 L1662,1154 L159,1154 L159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>independence → dependence: The repeated-clue failure arises from violating the stated within-class independence.</title></a><a href="#edge-22"><path d="M159,1305 C159,1332 159,1333 159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>dependence → calibration: The reliability warning requires a concrete failure mechanism for the model assumptions.</title></a><a href="#edge-23"><path d="M159,1115 L159,1135 L1674,1135 L1674,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>answer → target: The requested answer needs the 8.33% flagged-spam calculation and denominator distinction.</title></a><a href="#edge-24"><path d="M159,925 L159,945 L1686,945 L1686,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>vary → target: The requested answer explicitly needs the effect of changing base rate.</title></a><a href="#edge-25"><path d="M779,925 L779,945 L1698,945 L1698,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>word → target: The requested answer explicitly connects flag evidence to word evidence.</title></a><a href="#edge-26"><path d="M159,1495 C159,1522 159,1523 159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>calibration → target: The target qualifies naive Bayes confidence and therefore needs the model-versus-frequency distinction.</title></a><a href="#edge-27"><path d="M159,355 C159,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>condition → multiply: The q multiplier is defined within the selected group, so its denominator must be understood.</title></a><a href="#edge-28"><path d="M469,545 C469,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>multiply → counts: Multiplying 10,000 by class share and flag rate requires the within-group multiplication rule.</title></a><a href="#edge-29"><path d="M779,165 L779,185 L1710,185 L1710,774 L469,774 L469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>partition → total: Adding true and false flags requires the disjoint and exhaustive two-class sum rule.</title></a><a href="#edge-30"><path d="M469,545 C469,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>multiply → bayes: Prior times likelihood in the numerator and denominator requires the joint-probability multiplication rule.</title></a><a href="#edge-31"><path d="M779,165 L779,185 L1722,185 L1722,584 L469,584 L469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>partition → bayes: The full clue denominator requires summing the two class contributions.</title></a><a href="#edge-32"><path d="M469,165 L469,185 L1734,185 L1734,394 L1399,394 L1399,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>features → feature_value: Choosing occurrence or absence probability requires the binary feature meaning.</title></a><a href="#edge-33"><path d="M159,355 C159,382 1399,383 1399,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>condition → feature_value: The complement must be calculated within the same class as the occurrence rate.</title></a><a href="#edge-34"><path d="M1399,545 L1399,565 L1746,565 L1746,774 L1089,774 L1089,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>feature_value → scores: Each product factor must correspond to the observed present or absent value.</title></a><a href="#edge-35"><path d="M1089,925 C1089,952 469,953 469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>scores → normalize: Normalization needs the two unnormalized prior-weighted likelihood scores.</title></a><a href="#edge-36"><path d="M469,1115 C469,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>normalize → dependence: The numerical repeated-clue counterexample compares two normalized probabilities, not raw scores.</title></a><a href="#edge-37"><path d="M469,1115 L469,1135 L1758,1135 L1758,1344 L159,1344 L159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>normalize → calibration: The reliability question concerns a normalized model probability, whose construction must be understood.</title></a><a href="#edge-38"><path d="M469,1115 L469,1135 L1770,1135 L1770,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>normalize → target: The target explicitly explains normalizing word-pattern scores into model probabilities.</title></a><a href="#edge-39"><path d="M779,545 L779,565 L1782,565 L1782,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>estimate → target: The target explicitly says labeled messages can supply class and word rates; obtaining those estimates is separate from using supplied inputs.</title></a><a href="#node-chance"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#46734d" font-size="12">chance · supported</text><text x="36" y="77" font-size="15" fill="#101527">What does a probability</text><text x="36" y="97" font-size="15" fill="#101527">describe here?</text></a><a href="#node-condition"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">condition · supported</text><text x="36" y="267" font-size="15" fill="#101527">What changes when a percentage</text><text x="36" y="287" font-size="15" fill="#101527">is conditional?</text></a><a href="#node-given"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">given · supported</text><text x="36" y="457" font-size="15" fill="#101527">What exactly do the three</text><text x="36" y="477" font-size="15" fill="#101527">supplied rates say?</text></a><a href="#node-prior"><rect x="334" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="241" fill="#46734d" font-size="12">prior · supported</text><text x="346" y="267" font-size="15" fill="#101527">What is a base rate or prior?</text></a><a href="#node-counts"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">counts · supported</text><text x="36" y="647" font-size="15" fill="#101527">How many messages of each kind</text><text x="36" y="667" font-size="15" fill="#101527">get flagged?</text></a><a href="#node-total"><rect x="334" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="811" fill="#46734d" font-size="12">total · supported</text><text x="346" y="837" font-size="15" fill="#101527">What is the entire flagged</text><text x="346" y="857" font-size="15" fill="#101527">population?</text></a><a href="#node-answer"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">answer · supported</text><text x="36" y="1027" font-size="15" fill="#101527">What fraction of flagged</text><text x="36" y="1047" font-size="15" fill="#101527">messages is actually spam?</text></a><a href="#node-bayes"><rect x="334" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="621" fill="#46734d" font-size="12">bayes · supported</text><text x="346" y="647" font-size="15" fill="#101527">How does the counting rule</text><text x="346" y="667" font-size="15" fill="#101527">become Bayes’ rule?</text></a><a href="#node-vary"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">vary · supported</text><text x="36" y="837" font-size="15" fill="#101527">How does changing the base rate</text><text x="36" y="857" font-size="15" fill="#101527">change this filter’s answer?</text></a><a href="#node-word"><rect x="644" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="811" fill="#46734d" font-size="12">word · supported</text><text x="656" y="837" font-size="15" fill="#101527">How can a word serve as a clue?</text></a><a href="#node-features"><rect x="334" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="51" fill="#46734d" font-size="12">features · supported</text><text x="346" y="77" font-size="15" fill="#101527">What does the model record</text><text x="346" y="97" font-size="15" fill="#101527">about the message?</text></a><a href="#node-estimate"><rect x="644" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="431" fill="#46734d" font-size="12">estimate · supported</text><text x="656" y="457" font-size="15" fill="#101527">Where do the starting rate and</text><text x="656" y="477" font-size="15" fill="#101527">word-clue rates come from?</text></a><a href="#node-joint"><rect x="954" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="966" y="431" fill="#46734d" font-size="12">joint · supported</text><text x="966" y="457" font-size="15" fill="#101527">What probability is needed for</text><text x="966" y="477" font-size="15" fill="#101527">several clues together?</text></a><a href="#node-independence"><rect x="644" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="621" fill="#46734d" font-size="12">independence · supported</text><text x="656" y="647" font-size="15" fill="#101527">What does the naive</text><text x="656" y="667" font-size="15" fill="#101527">independence assumption add?</text></a><a href="#node-scores"><rect x="954" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="966" y="811" fill="#46734d" font-size="12">scores · supported</text><text x="966" y="837" font-size="15" fill="#101527">How do the prior and the</text><text x="966" y="857" font-size="15" fill="#101527">observed word pattern form a</text><text x="966" y="877" font-size="15" fill="#101527">class score?</text></a><a href="#node-dependence"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">dependence · supported</text><text x="36" y="1217" font-size="15" fill="#101527">What goes wrong when two clues</text><text x="36" y="1237" font-size="15" fill="#101527">repeat the same information?</text></a><a href="#node-calibration"><rect x="24" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1381" fill="#46734d" font-size="12">calibration · supported</text><text x="36" y="1407" font-size="15" fill="#101527">Does the model’s calculated</text><text x="36" y="1427" font-size="15" fill="#101527">probability guarantee the true</text><text x="36" y="1447" font-size="15" fill="#101527">spam fraction?</text></a><a href="#node-target"><rect x="24" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1571" fill="#46734d" font-size="12">target · supported</text><text x="36" y="1597" font-size="15" fill="#101527">Why is a flag not almost</text><text x="36" y="1617" font-size="15" fill="#101527">certain spam, how do base rates</text><text x="36" y="1637" font-size="15" fill="#101527">change the answer, and how do</text><text x="36" y="1657" font-size="15" fill="#101527">words supply evidence?</text></a><a href="#node-multiply"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">multiply · supported</text><text x="346" y="457" font-size="15" fill="#101527">How do within-group rates</text><text x="346" y="477" font-size="15" fill="#101527">become fractions of all mail?</text></a><a href="#node-partition"><rect x="644" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="51" fill="#46734d" font-size="12">partition · supported</text><text x="656" y="77" font-size="15" fill="#101527">How do contributions from</text><text x="656" y="97" font-size="15" fill="#101527">different classes form the clue</text><text x="656" y="117" font-size="15" fill="#101527">total?</text></a><a href="#node-feature_value"><rect x="1264" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1276" y="431" fill="#46734d" font-size="12">feature_value · supported</text><text x="1276" y="457" font-size="15" fill="#101527">What probability should an</text><text x="1276" y="477" font-size="15" fill="#101527">absent word contribute?</text></a><a href="#node-normalize"><rect x="334" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1001" fill="#46734d" font-size="12">normalize · supported</text><text x="346" y="1027" font-size="15" fill="#101527">How do the two class scores</text><text x="346" y="1047" font-size="15" fill="#101527">become a model probability?</text></a></svg>