<svg xmlns="http://www.w3.org/2000/svg" width="1154" height="1710" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M159,165 C159,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>baseline → entry: Understanding a key-value entry and testing key equality uses the stated Python baseline.</title></a><a href="#edge-2"><path d="M159,165 C159,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>baseline → array: The numbered-location calculation uses arithmetic and list indexing from the baseline.</title></a><a href="#edge-3"><path d="M159,165 C159,192 779,193 779,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>baseline → hash: An integer-valued function and equality rule use the baseline.</title></a><a href="#edge-4"><path d="M779,355 C779,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>hash → index: The index formula takes the computed hash code as its input.</title></a><a href="#edge-5"><path d="M159,545 C159,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>index → collision: The claim that distinct codes can choose the same bucket requires the capacity-dependent index mapping.</title></a><a href="#edge-6"><path d="M159,735 C159,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>collision → chain: The claim that one bucket must retain different keys requires distinguishing collision from equality.</title></a><a href="#edge-7"><path d="M159,355 L159,375 L958,375 L958,774 L159,774 L159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>entry → chain: The bucket sequence must retain key-value entries, not only keys.</title></a><a href="#edge-8"><path d="M469,355 L469,375 L970,375 L970,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>array → find: Lookup accesses the selected bucket directly at an array index.</title></a><a href="#edge-9"><path d="M159,545 L159,565 L982,565 L982,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>index → find: Lookup needs the query bucket index before accessing the bucket.</title></a><a href="#edge-10"><path d="M159,925 C159,952 469,953 469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>chain → find: The search iterates the selected sequence and returns the matching stored entry.</title></a><a href="#edge-11"><path d="M469,1115 C469,1142 469,1143 469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>find → expected: Expected lookup work counts the selected bucket’s equality comparisons.</title></a><a href="#edge-12"><path d="M159,1115 C159,1142 469,1143 469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>load → expected: The bounded expected chain-length claim depends on n/m staying bounded.</title></a><a href="#edge-13"><path d="M469,545 L469,565 L994,565 L994,1154 L469,1154 L469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>keycost → expected: Constant total lookup cost additionally requires bounded hash and equality cost.</title></a><a href="#edge-14"><path d="M469,1115 C469,1142 779,1143 779,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>find → worst: The n-comparison bound follows from scanning the selected sequence to its end.</title></a><a href="#edge-15"><path d="M159,1115 C159,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>load → growth: The reason increasing capacity helps is reducing n/m.</title></a><a href="#edge-16"><path d="M159,545 C159,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>index → reindex: The placement rule changes because its capacity input changes.</title></a><a href="#edge-17"><path d="M159,1305 C159,1332 159,1333 159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>growth → amortized: The geometric sum uses the successive doubled capacities from the growth policy.</title></a><a href="#edge-18"><path d="M469,735 L469,755 L1006,755 L1006,1344 L159,1344 L159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>reindex → amortized: The rebuilding cost counts redistributing existing entries.</title></a><a href="#edge-19"><path d="M469,1115 L469,1135 L1018,1135 L1018,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>find → target: The target’s fast lookup mechanism is computing one bucket and testing keys within it.</title></a><a href="#edge-20"><path d="M469,1305 L469,1325 L1030,1325 L1030,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>expected → target: The target’s expected constant-speed claim requires the load, distribution and primitive-cost conditions.</title></a><a href="#edge-21"><path d="M779,1305 L779,1325 L1042,1325 L1042,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>worst → target: The target’s limit on speed includes an individual lookup scanning all entries.</title></a><a href="#edge-22"><path d="M159,1305 L159,1325 L1054,1325 L1054,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>growth → target: The target’s reason for resizing is controlling load as entry count grows.</title></a><a href="#edge-23"><path d="M469,735 L469,755 L1066,755 L1066,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>reindex → target: The target’s resize mechanism requires redistributing old entries under the new capacity.</title></a><a href="#edge-24"><path d="M159,1495 C159,1522 159,1523 159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>amortized → target: The target distinguishes low average insertion overhead from a costly individual resize.</title></a><a href="#edge-25"><path d="M779,355 L779,375 L1078,375 L1078,584 L779,584 L779,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>hash → placement: Correct placement for an equal query relies on the equal-key/equal-code contract.</title></a><a href="#edge-26"><path d="M159,545 C159,572 779,573 779,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>index → placement: The invariant names the bucket produced from the code and current capacity.</title></a><a href="#edge-27"><path d="M779,735 L779,755 L1090,755 L1090,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>placement → find: Searching only that bucket can prove absence only if every matching entry would be there.</title></a><a href="#edge-28"><path d="M159,925 C159,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>chain → load: The mean n/m is the number of entries per bucket sequence, so the claim requires what each bucket stores.</title></a><a href="#edge-29"><path d="M779,355 C779,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>hash → keycost: The cost caveat counts computing the hash function defined in hash.</title></a><a href="#node-baseline"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">baseline · assumed</text><text x="36" y="77" font-size="15" fill="#101527">What can the reader already</text><text x="36" y="97" font-size="15" fill="#101527">use?</text></a><a href="#node-entry"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">entry · supported</text><text x="36" y="267" font-size="15" fill="#101527">What does a dictionary lookup</text><text x="36" y="287" font-size="15" fill="#101527">have to identify?</text></a><a href="#node-array"><rect x="334" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="241" fill="#46734d" font-size="12">array · supported</text><text x="346" y="267" font-size="15" fill="#101527">Why can a known array index be</text><text x="346" y="287" font-size="15" fill="#101527">accessed without inspecting</text><text x="346" y="307" font-size="15" fill="#101527">preceding entries?</text></a><a href="#node-hash"><rect x="644" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="241" fill="#46734d" font-size="12">hash · supported</text><text x="656" y="267" font-size="15" fill="#101527">What is a hash code and what</text><text x="656" y="287" font-size="15" fill="#101527">must equality imply?</text></a><a href="#node-index"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">index · supported</text><text x="36" y="457" font-size="15" fill="#101527">How does a code select one of m</text><text x="36" y="477" font-size="15" fill="#101527">buckets?</text></a><a href="#node-collision"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">collision · supported</text><text x="36" y="647" font-size="15" fill="#101527">What is a collision and why</text><text x="36" y="667" font-size="15" fill="#101527">does the index not identify the</text><text x="36" y="687" font-size="15" fill="#101527">key?</text></a><a href="#node-chain"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">chain · supported</text><text x="36" y="837" font-size="15" fill="#101527">How can one bucket retain</text><text x="36" y="857" font-size="15" fill="#101527">colliding entries?</text></a><a href="#node-find"><rect x="334" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1001" fill="#46734d" font-size="12">find · supported</text><text x="346" y="1027" font-size="15" fill="#101527">How does lookup find the right</text><text x="346" y="1047" font-size="15" fill="#101527">value or conclude that it is</text><text x="346" y="1067" font-size="15" fill="#101527">missing?</text></a><a href="#node-load"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">load · supported</text><text x="36" y="1027" font-size="15" fill="#101527">What makes bucket searches</text><text x="36" y="1047" font-size="15" fill="#101527">longer as a table fills?</text></a><a href="#node-expected"><rect x="334" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1191" fill="#46734d" font-size="12">expected · supported</text><text x="346" y="1217" font-size="15" fill="#101527">Under what assumptions is</text><text x="346" y="1237" font-size="15" fill="#101527">expected lookup time constant?</text></a><a href="#node-worst"><rect x="644" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="1191" fill="#46734d" font-size="12">worst · supported</text><text x="656" y="1217" font-size="15" fill="#101527">Why can one lookup still</text><text x="656" y="1237" font-size="15" fill="#101527">examine every key?</text></a><a href="#node-growth"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">growth · supported</text><text x="36" y="1217" font-size="15" fill="#101527">Why grow the table and what</text><text x="36" y="1237" font-size="15" fill="#101527">triggers growth?</text></a><a href="#node-reindex"><rect x="334" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="621" fill="#46734d" font-size="12">reindex · supported</text><text x="346" y="647" font-size="15" fill="#101527">Why must entries move when</text><text x="346" y="667" font-size="15" fill="#101527">capacity changes?</text></a><a href="#node-amortized"><rect x="24" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1381" fill="#46734d" font-size="12">amortized · supported</text><text x="36" y="1407" font-size="15" fill="#101527">How can occasional expensive</text><text x="36" y="1427" font-size="15" fill="#101527">growth have a small long-run</text><text x="36" y="1447" font-size="15" fill="#101527">insertion cost?</text></a><a href="#node-keycost"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">keycost · supported</text><text x="346" y="457" font-size="15" fill="#101527">What costs are hidden by</text><text x="346" y="477" font-size="15" fill="#101527">treating key operations as</text><text x="346" y="497" font-size="15" fill="#101527">constant?</text></a><a href="#node-target"><rect x="24" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1571" fill="#46734d" font-size="12">target · supported</text><text x="36" y="1597" font-size="15" fill="#101527">Why can dictionary lookup be</text><text x="36" y="1617" font-size="15" fill="#101527">fast, what do collisions and</text><text x="36" y="1637" font-size="15" fill="#101527">resizing do, and where does the</text><text x="36" y="1657" font-size="15" fill="#101527">speed claim stop?</text></a><a href="#node-placement"><rect x="644" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="621" fill="#46734d" font-size="12">placement · supported</text><text x="656" y="647" font-size="15" fill="#101527">What condition makes searching</text><text x="656" y="667" font-size="15" fill="#101527">only one bucket correct?</text></a></svg>