<svg xmlns="http://www.w3.org/2000/svg" width="2060" height="1710" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M159,165 C159,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>arithmetic → weighted_sum: Products and sums must be understood to say what the parameters do.</title></a><a href="#edge-2"><path d="M159,355 C159,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>weighted_sum → hidden: Hidden neurons in this chosen network perform weighted sums.</title></a><a href="#edge-3"><path d="M469,165 L469,185 L1888,185 L1888,394 L159,394 L159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>functions → hidden: Intermediate values require understanding that later computations reuse earlier results.</title></a><a href="#edge-4"><path d="M159,545 C159,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>hidden → prediction: The forward prediction depends on evaluating the intermediate layer first.</title></a><a href="#edge-5"><path d="M779,355 L779,375 L1900,375 L1900,584 L159,584 L159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>activation → prediction: This network’s forward evaluation includes ReLU; omitting its rule leaves predictions undetermined.</title></a><a href="#edge-6"><path d="M779,165 L779,185 L1912,185 L1912,774 L159,774 L159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>label → loss: Loss cannot quantify the requested mismatch without a desired output.</title></a><a href="#edge-7"><path d="M159,735 C159,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>prediction → loss: Loss compares the actual computed prediction with that desired output.</title></a><a href="#edge-8"><path d="M159,165 C159,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>arithmetic → sensitivity: Small differences and ratios supply the non-calculus definition.</title></a><a href="#edge-9"><path d="M469,355 C469,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sensitivity → add_rule: The numerical factor 1 only has meaning after defining a sensitivity.</title></a><a href="#edge-10"><path d="M469,355 C469,382 779,383 779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sensitivity → multiply_rule: The other-input factor must be interpreted as a local change ratio.</title></a><a href="#edge-11"><path d="M469,355 C469,382 1709,383 1709,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sensitivity → relu_rule: The factors 0 and 1 describe local change ratios.</title></a><a href="#edge-12"><path d="M779,355 C779,382 1709,383 1709,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>activation → relu_rule: ReLU’s piecewise function must be known to determine its local response.</title></a><a href="#edge-13"><path d="M469,355 C469,382 1089,383 1089,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sensitivity → chain: Multiplying change ratios is unintelligible without defining those ratios.</title></a><a href="#edge-14"><path d="M469,545 L469,565 L1924,565 L1924,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>add_rule → reverse: Backward propagation through weighted addition needs its local rule.</title></a><a href="#edge-15"><path d="M779,545 L779,565 L1936,565 L1936,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>multiply_rule → reverse: Backward propagation through weighting and squared error needs its product rule.</title></a><a href="#edge-16"><path d="M1709,545 L1709,565 L1948,565 L1948,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>relu_rule → reverse: This chosen network includes a ReLU requiring its backward rule.</title></a><a href="#edge-17"><path d="M1399,545 L1399,565 L1960,565 L1960,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>accumulate → reverse: Repeated uses require summing returned contributions, including the error used twice in its square.</title></a><a href="#edge-18"><path d="M159,925 C159,952 469,953 469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>loss → reverse: A scalar objective anchors what all returned sensitivities refer to.</title></a><a href="#edge-19"><path d="M159,1115 C159,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>gradient → update: Update direction and amount use each parameter’s sensitivity.</title></a><a href="#edge-20"><path d="M159,1305 C159,1332 159,1333 159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>update → training: Learning requires an actual parameter change between successive calculations.</title></a><a href="#edge-21"><path d="M469,1115 L469,1135 L1972,1135 L1972,1534 L159,1534 L159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>reverse → target: The answer needs the mechanism that computes parameter sensitivities.</title></a><a href="#edge-22"><path d="M159,1495 C159,1522 159,1523 159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>training → target: The answer needs the repeated update procedure that uses those sensitivities.</title></a><a href="#edge-23"><path d="M159,165 C159,192 779,193 779,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>arithmetic → activation: The max comparison and zero define this piecewise operation.</title></a><a href="#edge-24"><path d="M469,355 C469,382 1399,383 1399,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sensitivity → accumulate: Returned effects must be understood as small-change sensitivities before their sum has meaning.</title></a><a href="#edge-25"><path d="M159,925 C159,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>loss → gradient: A loss gradient must identify which scalar objective its components refer to.</title></a><a href="#edge-26"><path d="M469,355 L469,375 L1984,375 L1984,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sensitivity → gradient: The collection consists of individual partial sensitivities.</title></a><a href="#edge-27"><path d="M1089,545 L1089,565 L1996,565 L1996,964 L469,964 L469,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>chain → reverse: The backward step multiplies each incoming sensitivity by a local sensitivity.</title></a><a href="#node-arithmetic"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">arithmetic · assumed</text><text x="36" y="77" font-size="15" fill="#101527">What numerical operations can</text><text x="36" y="97" font-size="15" fill="#101527">we already use?</text></a><a href="#node-functions"><rect x="334" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="51" fill="#646c77" font-size="12">functions · assumed</text><text x="346" y="77" font-size="15" fill="#101527">How can a calculation reuse an</text><text x="346" y="97" font-size="15" fill="#101527">earlier result?</text></a><a href="#node-weighted_sum"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">weighted_sum · supported</text><text x="36" y="267" font-size="15" fill="#101527">What does a weight or bias</text><text x="36" y="287" font-size="15" fill="#101527">control?</text></a><a href="#node-hidden"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">hidden · supported</text><text x="36" y="457" font-size="15" fill="#101527">What is a hidden value?</text></a><a href="#node-activation"><rect x="644" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="241" fill="#46734d" font-size="12">activation · supported</text><text x="656" y="267" font-size="15" fill="#101527">What does the ReLU activation</text><text x="656" y="287" font-size="15" fill="#101527">calculate?</text></a><a href="#node-prediction"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">prediction · supported</text><text x="36" y="647" font-size="15" fill="#101527">How is the current prediction</text><text x="36" y="667" font-size="15" fill="#101527">obtained?</text></a><a href="#node-label"><rect x="644" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="51" fill="#46734d" font-size="12">label · supported</text><text x="656" y="77" font-size="15" fill="#101527">What does a labeled example</text><text x="656" y="97" font-size="15" fill="#101527">supply?</text></a><a href="#node-loss"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">loss · supported</text><text x="36" y="837" font-size="15" fill="#101527">How is prediction error made</text><text x="36" y="857" font-size="15" fill="#101527">into one number?</text></a><a href="#node-sensitivity"><rect x="334" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="241" fill="#46734d" font-size="12">sensitivity · supported</text><text x="346" y="267" font-size="15" fill="#101527">What does a derivative mean</text><text x="346" y="287" font-size="15" fill="#101527">without assuming calculus?</text></a><a href="#node-add_rule"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">add_rule · supported</text><text x="346" y="457" font-size="15" fill="#101527">How sensitive is a sum to</text><text x="346" y="477" font-size="15" fill="#101527">either input?</text></a><a href="#node-multiply_rule"><rect x="644" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="431" fill="#46734d" font-size="12">multiply_rule · supported</text><text x="656" y="457" font-size="15" fill="#101527">How sensitive is a product to</text><text x="656" y="477" font-size="15" fill="#101527">either input?</text></a><a href="#node-relu_rule"><rect x="1574" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1586" y="431" fill="#46734d" font-size="12">relu_rule · supported</text><text x="1586" y="457" font-size="15" fill="#101527">How does ReLU pass a tiny</text><text x="1586" y="477" font-size="15" fill="#101527">change?</text></a><a href="#node-chain"><rect x="954" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="966" y="431" fill="#46734d" font-size="12">chain · supported</text><text x="966" y="457" font-size="15" fill="#101527">How do sensitivities combine</text><text x="966" y="477" font-size="15" fill="#101527">along successive operations?</text></a><a href="#node-accumulate"><rect x="1264" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="1276" y="431" fill="#46734d" font-size="12">accumulate · supported</text><text x="1276" y="457" font-size="15" fill="#101527">What happens when a value</text><text x="1276" y="477" font-size="15" fill="#101527">affects the loss through</text><text x="1276" y="497" font-size="15" fill="#101527">several uses?</text></a><a href="#node-reverse"><rect x="334" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1001" fill="#46734d" font-size="12">reverse · supported</text><text x="346" y="1027" font-size="15" fill="#101527">How does backpropagation obtain</text><text x="346" y="1047" font-size="15" fill="#101527">every parameter sensitivity</text><text x="346" y="1067" font-size="15" fill="#101527">efficiently?</text></a><a href="#node-gradient"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">gradient · supported</text><text x="36" y="1027" font-size="15" fill="#101527">What is the gradient with</text><text x="36" y="1047" font-size="15" fill="#101527">respect to the weights and</text><text x="36" y="1067" font-size="15" fill="#101527">biases?</text></a><a href="#node-update"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">update · supported</text><text x="36" y="1217" font-size="15" fill="#101527">How can a gradient change the</text><text x="36" y="1237" font-size="15" fill="#101527">parameters to lower loss?</text></a><a href="#node-training"><rect x="24" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1381" fill="#46734d" font-size="12">training · supported</text><text x="36" y="1407" font-size="15" fill="#101527">How does this calculation</text><text x="36" y="1427" font-size="15" fill="#101527">become learning over examples?</text></a><a href="#node-target"><rect x="24" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1571" fill="#46734d" font-size="12">target · supported</text><text x="36" y="1597" font-size="15" fill="#101527">How does backpropagation tell a</text><text x="36" y="1617" font-size="15" fill="#101527">small network how to adjust</text><text x="36" y="1637" font-size="15" fill="#101527">each weight to learn?</text></a></svg>