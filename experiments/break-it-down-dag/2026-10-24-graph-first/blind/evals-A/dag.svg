<svg xmlns="http://www.w3.org/2000/svg" width="1154" height="2090" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M159,165 C159,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>input_output → behavior: Without input/output behavior, the object being tested is undefined.</title></a><a href="#edge-2"><path d="M469,165 C469,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>api → variation: Without knowing that the API generates a response, variation has no identified source.</title></a><a href="#edge-3"><path d="M159,355 C159,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>behavior → objective: The intended application task is needed to define task-specific success.</title></a><a href="#edge-4"><path d="M159,545 C159,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>objective → reference: Without defined success, an annotation cannot express the intended judgment for a case.</title></a><a href="#edge-5"><path d="M159,165 L159,185 L958,185 L958,774 L159,774 L159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>input_output → case: The reader must identify the input being recorded and the output later judged.</title></a><a href="#edge-6"><path d="M159,735 C159,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>reference → case: A runnable input alone lacks the case information needed to establish acceptable behavior.</title></a><a href="#edge-7"><path d="M159,925 C159,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>case → dataset: A reusable collection cannot be specified before its individual case is understood.</title></a><a href="#edge-8"><path d="M469,735 C469,762 779,763 779,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>grader → choice: Without knowing a grader’s function, different checking rules have no common purpose.</title></a><a href="#edge-9"><path d="M469,735 C469,762 469,763 469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>grader → calibration: Agreement with human judgments is a check on the automated grading judgment itself.</title></a><a href="#edge-10"><path d="M159,545 L159,565 L970,565 L970,774 L469,774 L469,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>objective → calibration: Human agreement matters only relative to what the application is intended to achieve.</title></a><a href="#edge-11"><path d="M159,1115 C159,1142 469,1143 469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>dataset → run: A run needs an identified collection of input cases.</title></a><a href="#edge-12"><path d="M469,735 L469,755 L982,755 L982,1154 L469,1154 L469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>grader → run: An evaluation run requires a rule to convert outputs into assessments.</title></a><a href="#edge-13"><path d="M469,165 L469,185 L994,185 L994,1154 L469,1154 L469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>api → run: Producing the application output requires the reader’s existing ability to call the model.</title></a><a href="#edge-14"><path d="M469,1305 C469,1332 469,1333 469,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>run → summary: An aggregate score needs the individual assessments produced by a run.</title></a><a href="#edge-15"><path d="M469,1305 C469,1332 159,1333 159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>run → compare: Comparison needs two executions with specified configurations and shared evaluation conditions.</title></a><a href="#edge-16"><path d="M469,1495 L469,1515 L1006,1515 L1006,1724 L159,1724 L159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>summary → limits: To interpret an aggregate score’s limitations, the reader must know what it summarizes.</title></a><a href="#edge-17"><path d="M469,925 L469,945 L1018,945 L1018,1724 L159,1724 L159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>calibration → limits: Without grader checking, the possibility that a score measures the wrong quality is unexplained.</title></a><a href="#edge-18"><path d="M159,1495 C159,1522 159,1523 159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>compare → improve: Without rerunning comparisons, a proposed fix has no evaluation evidence of improvement or regression.</title></a><a href="#edge-19"><path d="M779,925 L779,945 L1030,945 L1030,1914 L159,1914 L159,1930" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>choice → target: Starting requires selecting checks suited to the support requirements.</title></a><a href="#edge-20"><path d="M159,1685 L159,1705 L1042,1705 L1042,1914 L159,1914 L159,1930" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>improve → target: The requested purpose includes using evaluation evidence to improve the assistant.</title></a><a href="#edge-21"><path d="M159,1875 C159,1902 159,1903 159,1930" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>limits → target: Explaining why to use evals requires stating what their evidence does and does not establish.</title></a><a href="#edge-22"><path d="M159,545 C159,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>objective → grader: A grading rule needs a definition of success; a reference answer is optional for rules such as format checks.</title></a><a href="#edge-23"><path d="M779,165 L779,185 L1054,185 L1054,1344 L469,1344 L469,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>arithmetic → summary: A pass rate requires understanding a fraction of observed cases.</title></a><a href="#edge-24"><path d="M159,1115 C159,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>dataset → coverage: Representation concerns which cases the collection includes.</title></a><a href="#edge-25"><path d="M469,355 L469,375 L1066,375 L1066,1534 L469,1534 L469,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>variation → uncertainty: Without output variation, differing results across identical attempts have no explained source.</title></a><a href="#edge-26"><path d="M469,1305 L469,1325 L1078,1325 L1078,1534 L469,1534 L469,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>run → uncertainty: Repeated attempts require an identified execution of cases and grading.</title></a><a href="#edge-27"><path d="M469,1495 C469,1522 469,1523 469,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>summary → uncertainty: A reported score difference requires understanding the scores being compared.</title></a><a href="#edge-28"><path d="M469,1685 C469,1712 159,1713 159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>uncertainty → limits: Sampling and repeated-attempt limits explain why observed differences may not settle a decision.</title></a><a href="#edge-29"><path d="M159,1305 L159,1325 L1090,1325 L1090,1724 L159,1724 L159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>coverage → limits: Extrapolating to production requires knowing which production situations were represented.</title></a><a href="#node-input_output"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">input_output · assumed</text><text x="36" y="77" font-size="15" fill="#101527">What does it mean to run a</text><text x="36" y="97" font-size="15" fill="#101527">program on an input?</text></a><a href="#node-api"><rect x="334" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="51" fill="#646c77" font-size="12">api · assumed</text><text x="346" y="77" font-size="15" fill="#101527">What does calling a model API</text><text x="346" y="97" font-size="15" fill="#101527">do?</text></a><a href="#node-behavior"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">behavior · supported</text><text x="36" y="267" font-size="15" fill="#101527">What behavior does an</text><text x="36" y="287" font-size="15" fill="#101527">application eval measure?</text></a><a href="#node-variation"><rect x="334" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="241" fill="#46734d" font-size="12">variation · supported</text><text x="346" y="267" font-size="15" fill="#101527">Why can a few good answers be</text><text x="346" y="287" font-size="15" fill="#101527">misleading?</text></a><a href="#node-objective"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">objective · supported</text><text x="36" y="457" font-size="15" fill="#101527">How do you decide what counts</text><text x="36" y="477" font-size="15" fill="#101527">as a successful support answer?</text></a><a href="#node-reference"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">reference · supported</text><text x="36" y="647" font-size="15" fill="#101527">What information establishes</text><text x="36" y="667" font-size="15" fill="#101527">the intended answer for one</text><text x="36" y="687" font-size="15" fill="#101527">case?</text></a><a href="#node-case"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">case · supported</text><text x="36" y="837" font-size="15" fill="#101527">What is a test case?</text></a><a href="#node-dataset"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">dataset · supported</text><text x="36" y="1027" font-size="15" fill="#101527">Why collect more than one case?</text></a><a href="#node-grader"><rect x="334" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="621" fill="#46734d" font-size="12">grader · supported</text><text x="346" y="647" font-size="15" fill="#101527">What is a grader?</text></a><a href="#node-choice"><rect x="644" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="811" fill="#46734d" font-size="12">choice · supported</text><text x="656" y="837" font-size="15" fill="#101527">How do you choose a grading</text><text x="656" y="857" font-size="15" fill="#101527">rule?</text></a><a href="#node-calibration"><rect x="334" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="811" fill="#46734d" font-size="12">calibration · supported</text><text x="346" y="837" font-size="15" fill="#101527">Why check the grader against</text><text x="346" y="857" font-size="15" fill="#101527">human judgments?</text></a><a href="#node-run"><rect x="334" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1191" fill="#46734d" font-size="12">run · supported</text><text x="346" y="1217" font-size="15" fill="#101527">What happens during an eval</text><text x="346" y="1237" font-size="15" fill="#101527">run?</text></a><a href="#node-summary"><rect x="334" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1381" fill="#46734d" font-size="12">summary · supported</text><text x="346" y="1407" font-size="15" fill="#101527">What does an overall score tell</text><text x="346" y="1427" font-size="15" fill="#101527">you?</text></a><a href="#node-compare"><rect x="24" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1381" fill="#46734d" font-size="12">compare · supported</text><text x="36" y="1407" font-size="15" fill="#101527">How can you tell whether a</text><text x="36" y="1427" font-size="15" fill="#101527">change improved the assistant?</text></a><a href="#node-limits"><rect x="24" y="1740" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1761" fill="#46734d" font-size="12">limits · supported</text><text x="36" y="1787" font-size="15" fill="#101527">Why does a good eval score not</text><text x="36" y="1807" font-size="15" fill="#101527">guarantee production success?</text></a><a href="#node-improve"><rect x="24" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1571" fill="#46734d" font-size="12">improve · supported</text><text x="36" y="1597" font-size="15" fill="#101527">How do evaluation results lead</text><text x="36" y="1617" font-size="15" fill="#101527">to useful changes?</text></a><a href="#node-target"><rect x="24" y="1930" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1951" fill="#46734d" font-size="12">target · supported</text><text x="36" y="1977" font-size="15" fill="#101527">Why use evals, and how should a</text><text x="36" y="1997" font-size="15" fill="#101527">Python programmer start</text><text x="36" y="2017" font-size="15" fill="#101527">evaluating a customer-support</text><text x="36" y="2037" font-size="15" fill="#101527">assistant?</text></a><a href="#node-arithmetic"><rect x="644" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="51" fill="#646c77" font-size="12">arithmetic · assumed</text><text x="656" y="77" font-size="15" fill="#101527">What does a fraction of cases</text><text x="656" y="97" font-size="15" fill="#101527">mean?</text></a><a href="#node-uncertainty"><rect x="334" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1571" fill="#46734d" font-size="12">uncertainty · supported</text><text x="346" y="1597" font-size="15" fill="#101527">Why might an observed score</text><text x="346" y="1617" font-size="15" fill="#101527">difference be inconclusive?</text></a><a href="#node-coverage"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">coverage · supported</text><text x="36" y="1217" font-size="15" fill="#101527">Which real-world situations</text><text x="36" y="1237" font-size="15" fill="#101527">does a dataset represent?</text></a></svg>