<svg xmlns="http://www.w3.org/2000/svg" width="1082" height="1900" role="img" aria-label="Prerequisite graph; arrows point to the dependent concept"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#646c77"/></marker></defs><a href="#edge-1"><path d="M159,165 C159,192 159,193 159,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>arithmetic → parameters: Weighted sums require multiplication and addition.</title></a><a href="#edge-2"><path d="M159,355 C159,382 159,383 159,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>parameters → activation: An activation acts on the weighted sum whose role must be understood.</title></a><a href="#edge-3"><path d="M159,355 C159,382 469,383 469,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>parameters → loss: Loss compares network outputs to desired outputs.</title></a><a href="#edge-4"><path d="M159,165 C159,192 469,193 469,220" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>arithmetic → sensitivity: A ratio of changes and signed scaling use known arithmetic.</title></a><a href="#edge-5"><path d="M469,355 L469,375 L958,375 L958,584 L469,584 L469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sensitivity → local_rules: Local rules quantify the tiny-change effect just defined.</title></a><a href="#edge-6"><path d="M159,545 C159,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>activation → local_rules: The ReLU sensitivity requires its piecewise forward rule.</title></a><a href="#edge-7"><path d="M469,735 C469,762 159,763 159,790" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>local_rules → chain: Path sensitivity composes the local arithmetic factors.</title></a><a href="#edge-8"><path d="M469,355 C469,382 779,383 779,410" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>sensitivity → branch: Combining contributions requires understanding what each sensitivity measures.</title></a><a href="#edge-9"><path d="M159,925 C159,952 159,953 159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>chain → reverse: Backward multiplication is the chain rule applied locally.</title></a><a href="#edge-10"><path d="M779,545 L779,565 L970,565 L970,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>branch → reverse: The backward algorithm must accumulate every use of shared values.</title></a><a href="#edge-11"><path d="M159,355 L159,375 L982,375 L982,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>parameters → reverse: Saved intermediate values come from evaluating the network.</title></a><a href="#edge-12"><path d="M469,545 L469,565 L994,565 L994,964 L159,964 L159,980" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>loss → reverse: The scalar loss is the backward starting point.</title></a><a href="#edge-13"><path d="M159,1115 C159,1142 159,1143 159,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>reverse → gradient: Collecting the backward results at parameters yields the gradient.</title></a><a href="#edge-14"><path d="M159,1305 C159,1332 159,1333 159,1360" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>gradient → update: Parameter updates need the corresponding signed sensitivities.</title></a><a href="#edge-15"><path d="M159,1495 C159,1522 159,1523 159,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>update → limits: Step-size limitations and repeated training qualify the learning rule.</title></a><a href="#edge-16"><path d="M159,545 C159,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>activation → trace_forward: The trace needs the exact hidden activation calculation.</title></a><a href="#edge-17"><path d="M469,545 C469,572 159,573 159,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>loss → trace_forward: The trace needs an explicit scalar error formula.</title></a><a href="#edge-18"><path d="M159,735 L159,755 L1006,755 L1006,1154 L469,1154 L469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>trace_forward → trace_backward: Local backward factors depend on the numerical forward values.</title></a><a href="#edge-19"><path d="M159,1115 C159,1142 469,1143 469,1170" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>reverse → trace_backward: The numerical trace needs the backward multiplication and accumulation procedure.</title></a><a href="#edge-20"><path d="M469,1305 L469,1325 L1018,1325 L1018,1534 L469,1534 L469,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>trace_backward → trace_update: Parameter changes need the computed parameter sensitivities.</title></a><a href="#edge-21"><path d="M159,1495 C159,1522 469,1523 469,1550" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>update → trace_update: The numerical changes instantiate the chosen update rule.</title></a><a href="#edge-22"><path d="M469,1685 C469,1712 159,1713 159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>trace_update → target: The full numerical example makes the learning mechanism traceable.</title></a><a href="#edge-23"><path d="M159,1685 C159,1712 159,1713 159,1740" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>limits → target: The answer must distinguish local sensitivity and training progress from stronger guarantees.</title></a><a href="#edge-24"><path d="M469,545 C469,572 469,573 469,600" fill="none" stroke="#646c77" stroke-width="1.3" marker-end="url(#arrow)"/><title>loss → local_rules: Deriving p-y requires the selected half-squared loss and a fixed target y.</title></a><a href="#node-arithmetic"><rect x="24" y="30" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="51" fill="#646c77" font-size="12">arithmetic · assumed</text><text x="36" y="77" font-size="15" fill="#101527">What can the reader already</text><text x="36" y="97" font-size="15" fill="#101527">calculate?</text></a><a href="#node-parameters"><rect x="24" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="241" fill="#46734d" font-size="12">parameters · supported</text><text x="36" y="267" font-size="15" fill="#101527">What does a tiny network</text><text x="36" y="287" font-size="15" fill="#101527">calculate, and which numbers</text><text x="36" y="307" font-size="15" fill="#101527">can learning change?</text></a><a href="#node-activation"><rect x="24" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="431" fill="#46734d" font-size="12">activation · supported</text><text x="36" y="457" font-size="15" fill="#101527">Why put a nonlinear operation</text><text x="36" y="477" font-size="15" fill="#101527">between weighted sums, and what</text><text x="36" y="497" font-size="15" fill="#101527">does ReLU calculate?</text></a><a href="#node-loss"><rect x="334" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="431" fill="#46734d" font-size="12">loss · supported</text><text x="346" y="457" font-size="15" fill="#101527">How is a prediction mismatch</text><text x="346" y="477" font-size="15" fill="#101527">turned into one number to</text><text x="346" y="497" font-size="15" fill="#101527">reduce?</text></a><a href="#node-sensitivity"><rect x="334" y="220" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="241" fill="#46734d" font-size="12">sensitivity · supported</text><text x="346" y="267" font-size="15" fill="#101527">What does sensitivity mean</text><text x="346" y="287" font-size="15" fill="#101527">without assuming calculus?</text></a><a href="#node-local_rules"><rect x="334" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="621" fill="#46734d" font-size="12">local_rules · supported</text><text x="346" y="647" font-size="15" fill="#101527">How do addition,</text><text x="346" y="667" font-size="15" fill="#101527">multiplication, squaring, and</text><text x="346" y="687" font-size="15" fill="#101527">ReLU respond to tiny changes?</text></a><a href="#node-chain"><rect x="24" y="790" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="811" fill="#46734d" font-size="12">chain · supported</text><text x="36" y="837" font-size="15" fill="#101527">How does a small effect pass</text><text x="36" y="857" font-size="15" fill="#101527">through successive</text><text x="36" y="877" font-size="15" fill="#101527">calculations?</text></a><a href="#node-branch"><rect x="644" y="410" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="656" y="431" fill="#46734d" font-size="12">branch · supported</text><text x="656" y="457" font-size="15" fill="#101527">What if one value affects the</text><text x="656" y="477" font-size="15" fill="#101527">loss along multiple paths?</text></a><a href="#node-reverse"><rect x="24" y="980" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1001" fill="#46734d" font-size="12">reverse · supported</text><text x="36" y="1027" font-size="15" fill="#101527">Why work backward, and what</text><text x="36" y="1047" font-size="15" fill="#101527">must be saved?</text></a><a href="#node-gradient"><rect x="24" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1191" fill="#46734d" font-size="12">gradient · supported</text><text x="36" y="1217" font-size="15" fill="#101527">What information does the</text><text x="36" y="1237" font-size="15" fill="#101527">completed backward pass</text><text x="36" y="1257" font-size="15" fill="#101527">provide?</text></a><a href="#node-update"><rect x="24" y="1360" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1381" fill="#46734d" font-size="12">update · supported</text><text x="36" y="1407" font-size="15" fill="#101527">How are these sensitivities</text><text x="36" y="1427" font-size="15" fill="#101527">used to learn?</text></a><a href="#node-limits"><rect x="24" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1571" fill="#46734d" font-size="12">limits · supported</text><text x="36" y="1597" font-size="15" fill="#101527">Why can a gradient-based</text><text x="36" y="1617" font-size="15" fill="#101527">adjustment fail to lower the</text><text x="36" y="1637" font-size="15" fill="#101527">desired error?</text></a><a href="#node-trace_forward"><rect x="24" y="600" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="621" fill="#46734d" font-size="12">trace_forward · supported</text><text x="36" y="647" font-size="15" fill="#101527">What exact tiny network and</text><text x="36" y="667" font-size="15" fill="#101527">prediction error will we use?</text></a><a href="#node-trace_backward"><rect x="334" y="1170" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1191" fill="#46734d" font-size="12">trace_backward · supported</text><text x="346" y="1217" font-size="15" fill="#101527">What numerical sensitivity does</text><text x="346" y="1237" font-size="15" fill="#101527">each parameter receive?</text></a><a href="#node-trace_update"><rect x="334" y="1550" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="346" y="1571" fill="#46734d" font-size="12">trace_update · supported</text><text x="346" y="1597" font-size="15" fill="#101527">Does a small simultaneous</text><text x="346" y="1617" font-size="15" fill="#101527">update actually reduce this</text><text x="346" y="1637" font-size="15" fill="#101527">example loss?</text></a><a href="#node-target"><rect x="24" y="1740" width="270" height="135" fill="white" stroke="#cbd0d3"/><text x="36" y="1761" fill="#46734d" font-size="12">target · supported</text><text x="36" y="1787" font-size="15" fill="#101527">How does a tiny network work</text><text x="36" y="1807" font-size="15" fill="#101527">out each weight’s influence on</text><text x="36" y="1827" font-size="15" fill="#101527">prediction error and use that</text><text x="36" y="1847" font-size="15" fill="#101527">information to learn?</text></a></svg>