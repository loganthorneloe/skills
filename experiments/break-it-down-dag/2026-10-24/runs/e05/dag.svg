<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1260" viewBox="0 0 1050 1260" role="img" aria-labelledby="title"><title id="title">Prerequisites for evaluating a support assistant</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2f6c9e"/></marker></defs><rect width="100%" height="100%" fill="#f5f4f0"/><path d="M680 100 H710 V460 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>Must distinguish program execution from correct behavior.</title></path><path d="M680 220 H731 V580 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>Expected behavior determines what context and checks a case needs.</title></path><path d="M680 580 H752 V820 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>A grader needs an explicit input and expected behavior.</title></path><path d="M680 820 H773 V940 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>Aggregate scores only mean something once individual judgments are defined.</title></path><path d="M680 940 H794 V1060 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>Comparisons require understanding finite and variable observations.</title></path><path d="M680 1060 H815 V1180 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>Release decisions require comparable evidence.</title></path><path d="M680 580 H836 V1180 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>Implementation needs concrete case records.</title></path><path d="M680 220 H857 V700 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>Knowing success criteria explains why both final effect and required permission matter.</title></path><path d="M680 700 H878 V820 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>Checks must target correct observables.</title></path><path d="M680 340 H899 V940 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>Generalization depends on how the sample relates to future traffic.</title></path><path d="M680 460 H920 V940 H685" fill="none" stroke="#2f6c9e" stroke-width="1.3" marker-end="url(#arrow)"><title>Repeated executions can disagree even on one case.</title></path><rect x="25" y="70" width="655" height="78" fill="white" stroke="#cbd0d3"/><text x="42" y="95" font-family="sans-serif" font-size="16">program · assumed</text><text x="42" y="123" font-family="sans-serif" font-size="14">What does a program do with input and output?</text><rect x="25" y="190" width="655" height="78" fill="white" stroke="#cbd0d3"/><text x="42" y="215" font-family="sans-serif" font-size="16">goal · supported</text><text x="42" y="243" font-family="sans-serif" font-size="14">What observable behavior counts as successful customer support?</text><rect x="25" y="310" width="655" height="78" fill="white" stroke="#cbd0d3"/><text x="42" y="335" font-family="sans-serif" font-size="16">population · supported</text><text x="42" y="363" font-family="sans-serif" font-size="14">Which future support requests does a test set represent?</text><rect x="25" y="430" width="655" height="78" fill="white" stroke="#cbd0d3"/><text x="42" y="455" font-family="sans-serif" font-size="16">variation · supported</text><text x="42" y="483" font-family="sans-serif" font-size="14">Why can a support application fail even when its model sounds fluent?</text><rect x="25" y="550" width="655" height="78" fill="white" stroke="#cbd0d3"/><text x="42" y="575" font-family="sans-serif" font-size="16">case · supported</text><text x="42" y="603" font-family="sans-serif" font-size="14">How does a test case make that behavior testable?</text><rect x="25" y="670" width="655" height="78" fill="white" stroke="#cbd0d3"/><text x="42" y="695" font-family="sans-serif" font-size="16">outcome · supported</text><text x="42" y="723" font-family="sans-serif" font-size="14">Why inspect actual records and the action history?</text><rect x="25" y="790" width="655" height="78" fill="white" stroke="#cbd0d3"/><text x="42" y="815" font-family="sans-serif" font-size="16">grader · supported</text><text x="42" y="843" font-family="sans-serif" font-size="14">How can correctness be judged when many answers are acceptable?</text><rect x="25" y="910" width="655" height="78" fill="white" stroke="#cbd0d3"/><text x="42" y="935" font-family="sans-serif" font-size="16">sample · supported</text><text x="42" y="963" font-family="sans-serif" font-size="14">What does a score on a finite set of cases tell us?</text><rect x="25" y="1030" width="655" height="78" fill="white" stroke="#cbd0d3"/><text x="42" y="1055" font-family="sans-serif" font-size="16">compare · supported</text><text x="42" y="1083" font-family="sans-serif" font-size="14">How can a developer tell whether a change helped?</text><rect x="25" y="1150" width="655" height="78" fill="white" stroke="#cbd0d3"/><text x="42" y="1175" font-family="sans-serif" font-size="16">workflow · supported</text><text x="42" y="1203" font-family="sans-serif" font-size="14">How do I start and maintain evals for a support assistant?</text></svg>