ability</text><rect x="450" y="40" width="350" height="64" fill="white" stroke="#cbd0d3"/><text x="466" y="77" font-family="sans-serif" font-size="16" fill="#101527">Easy forward; difficult reverse</text><rect x="450" y="150" width="350" height="64" fill="white" stroke="#cbd0d3"/><text x="466" y="187" font-family="sans-serif" font-size="16" fill="#101527">Remainder arithmetic</text><rect x="40" y="260" width="350" height="64" fill="white" stroke="#cbd0d3"/><text x="56" y="297" font-family="sans-serif" font-size="16" fill="#101527">Related keys, different capabilities</text><rect x="40" y="370" width="350" height="64" fill="white" stroke="#cbd0d3"/><text x="56" y="407" font-family="sans-serif" font-size="16" fill="#101527">RSA round-trip calculation</text><rect x="40" y="480" width="350" height="64" fill="white" stroke="#cbd0d3"/><text x="56" y="517" font-family="sans-serif" font-size="16" fill="#101527">Why fresh randomness matters</text><rect x="40" y="590" width="350" height="64" fill="white" stroke="#cbd0d3"/><text x="56" y="627" font-family="sans-serif" font-size="16" fill="#101527">Shared secret + file encryption</text><rect x="450" y="590" width="350" height="64" fill="white" stroke="#cbd0d3"/><text x="466" y="627" font-family="sans-serif" font-size="16" fill="#101527">Authentic public-key ownership</text><rect x="40" y="700" width="350" height="64" fill="white" stroke="#cbd0d3"/><text x="56" y="737" font-family="sans-serif" font-size="16" fill="#101527">Limits and compromise</text><rect x="40" y="810" width="350" height="64" fill="white" stroke="#cbd0d3"/><text x="56" y="847" font-family="sans-serif" font-size="16" fill="#101527">Why a public key can preserve privacy</text></svg>