<svg xmlns="http://www.w3.org/2000/svg" width="860" height="690" viewBox="0 0 860 690"><title>Prerequisite graph for causal inference explanation</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#646c77"/></marker></defs><rect width="860" height="690" fill="#f5f4f0"/><path d="M145,95 L325,150" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>Need to understand the observed contrast before asking why it may be misleading.</title></path><path d="M505,95 L325,150" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>Need an effect definition to distinguish effect from selection.</title></path><path d="M325,215 L145,270" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>Need the selection problem to understand what random assignment resolves.</title></path><path d="M145,335 L145,400" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>Need the assignment comparison before distinguishing it from actual use.</title></path><path d="M145,335 L415,400" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>Need the intended randomized comparison before examining post-assignment changes.</title></path><path d="M145,335 L685,400" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>Need random assignment before interpreting chance imbalance.</title></path><path d="M325,215 L685,270" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>Adjustment is an attempted solution to common causes, not a generic correlation procedure.</title></path><path d="M505,95 L840,120 L840,550 L415,570" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>The question needs a defined causal contrast.</title></path><path d="M145,465 L415,570" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>The estimated effect must match the offered or used intervention.</title></path><path d="M415,465 L415,570" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>Observed results must preserve the intended comparison.</title></path><path d="M685,465 L415,570" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>Causal conclusions require calibrated precision.</title></path><path d="M685,335 L415,570" fill="none" stroke="#646c77" marker-end="url(#arrow)"><title>The answer should explain the alternative when a trial cannot be run.</title></path><g><rect x="30" y="30" width="230" height="65" fill="white" stroke="#cbd0d3"/><text x="145" y="57" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">Observed group</text><text x="145" y="79" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">averages</text></g><g><rect x="390" y="30" width="230" height="65" fill="white" stroke="#cbd0d3"/><text x="505" y="57" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">Define the causal</text><text x="505" y="79" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">comparison</text></g><g><rect x="210" y="150" width="230" height="65" fill="white" stroke="#cbd0d3"/><text x="325" y="177" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">Selection and</text><text x="325" y="199" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">confounding</text></g><g><rect x="30" y="270" width="230" height="65" fill="white" stroke="#cbd0d3"/><text x="145" y="297" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">Random</text><text x="145" y="319" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">assignment</text></g><g><rect x="570" y="270" width="230" height="65" fill="white" stroke="#cbd0d3"/><text x="685" y="297" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">Nonrandom</text><text x="685" y="319" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">alternatives</text></g><g><rect x="30" y="400" width="230" height="65" fill="white" stroke="#cbd0d3"/><text x="145" y="427" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">Offer versus</text><text x="145" y="449" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">actual use</text></g><g><rect x="300" y="400" width="230" height="65" fill="white" stroke="#cbd0d3"/><text x="415" y="427" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">Missing scores</text><text x="415" y="449" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">and shared exposure</text></g><g><rect x="570" y="400" width="230" height="65" fill="white" stroke="#cbd0d3"/><text x="685" y="427" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">Chance and</text><text x="685" y="449" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">uncertainty</text></g><g><rect x="300" y="570" width="230" height="65" fill="white" stroke="#cbd0d3"/><text x="415" y="597" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">Estimate whether</text><text x="415" y="619" text-anchor="middle" font-family="Arial" font-size="17" fill="#101527">the app helped</text></g></svg>